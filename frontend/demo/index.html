<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教研管理平台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ========== CSS Variables ========== */
:root {
  --primary: #1677FF;
  --primary-light: #4096FF;
  --primary-bg: #E6F4FF;
  --success: #52C41A;
  --success-bg: #F6FFED;
  --warning: #FAAD14;
  --warning-bg: #FFFBE6;
  --error: #FF4D4F;
  --error-bg: #FFF2F0;
  --bg: #F5F5F5;
  --card-bg: #FFFFFF;
  --text-main: #262626;
  --text-sub: #8C8C8C;
  --text-disabled: #BFBFBF;
  --border: #D9D9D9;
  --border-light: #F0F0F0;
  --sidebar-bg: #FFFFFF;
  --sidebar-text: #262626;
  --sidebar-active: #1677FF;
  --radius: 8px;
  --radius-sm: 4px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 6px 16px rgba(0,0,0,0.12);
  --sidebar-w: 220px;
  --header-h: 56px;
  --transition: 0.2s ease;
}

/* ========== Reset ========== */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size:14px; color:var(--text-main); background:var(--bg); }
a { text-decoration:none; color:var(--primary); }
ul, ol { list-style:none; }
input, select, textarea { font-family:inherit; font-size:14px; outline:none; }
button { font-family:inherit; cursor:pointer; border:none; border-radius:var(--radius-sm); transition:var(--transition); }

/* ========== Login Page ========== */
#loginPage {
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
.login-card {
  background:#fff; border-radius:16px; padding:40px;
  width:400px; max-width:90vw; box-shadow:0 20px 60px rgba(0,0,0,0.2);
  text-align:center;
}
.login-card h1 { font-size:24px; margin-bottom:8px; color:var(--primary); }
.login-card p { color:var(--text-sub); margin-bottom:32px; }
.login-card .role-select { display:flex; gap:12px; margin-bottom:24px; }
.login-card .role-btn {
  flex:1; padding:16px; border:2px solid var(--border-light); border-radius:var(--radius);
  background:#fff; transition:var(--transition); text-align:center;
}
.login-card .role-btn:hover { border-color:var(--primary); }
.login-card .role-btn.active { border-color:var(--primary); background:var(--primary-bg); }
.login-card .role-btn .icon { font-size:28px; }
.login-card .role-btn .label { font-size:14px; margin-top:4px; font-weight:600; }
.login-card .role-btn .desc { font-size:12px; color:var(--text-sub); margin-top:2px; }
.login-card .form-group { margin-bottom:16px; text-align:left; }
.login-card .form-group label { display:block; margin-bottom:6px; font-size:13px; color:var(--text-sub); }
.login-card .form-group input {
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
}
.login-card .login-btn {
  width:100%; padding:12px; background:var(--primary); color:#fff; font-size:16px; font-weight:600;
  border-radius:var(--radius-sm); margin-top:8px;
}
.login-card .login-btn:hover { background:var(--primary-light); }
.login-hint { margin-top:16px; font-size:12px; color:var(--text-sub); }

/* ========== Layout ========== */
#app { display:flex; height:100vh; overflow:hidden; }
#sidebar {
  width:var(--sidebar-w); background:var(--sidebar-bg); color:var(--sidebar-text);
  display:flex; flex-direction:column; flex-shrink:0; transition:transform 0.3s ease; z-index:100;
  border-right:1px solid var(--border-light);
}
#sidebar .logo {
  height:var(--header-h); display:flex; align-items:center; padding:0 20px;
  font-size:16px; font-weight:700; color:var(--primary); white-space:nowrap; overflow:hidden;
}
#sidebar .logo span { color:var(--primary); }
#sidebarNav { flex:1; overflow-y:auto; padding:8px 0; }
#sidebarNav .nav-group { margin-bottom:4px; }
#sidebarNav .nav-group-title {
  padding:8px 20px; font-size:11px; text-transform:uppercase; letter-spacing:1px;
  color:var(--text-sub); white-space:nowrap;
}
#sidebarNav .nav-item {
  display:flex; align-items:center; gap:10px; padding:10px 20px; cursor:pointer;
  white-space:nowrap; transition:var(--transition); font-size:14px; color:var(--text-main);
}
#sidebarNav .nav-item:hover { background:var(--border-light); }
#sidebarNav .nav-item.active { background:var(--primary-bg); color:var(--primary); }
#sidebarNav .nav-item .icon { font-size:16px; width:20px; text-align:center; }
#sidebarNav .nav-item .arrow { margin-left:auto; font-size:10px; transition:transform 0.2s; }
#sidebarNav .nav-item.expanded .arrow { transform:rotate(90deg); }
#sidebarNav .nav-children { overflow:hidden; max-height:0; transition:max-height 0.3s ease; }
#sidebarNav .nav-children.open { max-height:300px; }
#sidebarNav .nav-child-item {
  padding:8px 20px 8px 48px; cursor:pointer; font-size:13px; color:var(--text-sub);
  transition:var(--transition); white-space:nowrap;
}
#sidebarNav .nav-child-item:hover { color:var(--text-main); background:var(--border-light); }
#sidebarNav .nav-child-item.active { color:var(--primary); background:var(--primary-bg); }

#main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#header {
  height:var(--header-h); background:var(--card-bg); border-bottom:1px solid var(--border-light);
  display:flex; align-items:center; padding:0 20px; gap:16px; flex-shrink:0;
  box-shadow:0 1px 4px rgba(0,0,0,0.04); position:relative; z-index:50;
}
#header .menu-toggle { display:none; font-size:20px; cursor:pointer; background:none; }
#header .breadcrumb { font-size:14px; color:var(--text-sub); }
#header .breadcrumb span { color:var(--text-main); }
#header .header-right { margin-left:auto; display:flex; align-items:center; gap:16px; }
#header .role-badge {
  padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600;
}
#header .role-badge.admin { background:var(--primary-bg); color:var(--primary); }
#header .role-badge.teacher { background:var(--success-bg); color:var(--success); }
#header .user-info { display:flex; align-items:center; gap:8px; cursor:pointer; }
#header .user-avatar {
  width:32px; height:32px; border-radius:50%; background:var(--primary);
  color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600;
}
#header .user-name { font-size:14px; }

/* ========== Theme Switcher（主题色选择，Vben Admin V5 风格） ========== */
#header .theme-switcher {
  position:relative; display:flex; align-items:center; gap:6px; cursor:pointer;
  padding:4px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);
  font-size:13px; color:var(--text-main); background:var(--card-bg); transition:var(--transition);
}
#header .theme-switcher:hover { border-color:var(--primary); color:var(--primary); }
#header .theme-dot { width:14px; height:14px; border-radius:50%; background:var(--primary); flex-shrink:0; }
#header .theme-panel {
  display:none; position:absolute; top:calc(100% + 8px); right:0;
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow-lg); padding:14px; width:300px; z-index:300; cursor:default;
}
#header .theme-panel.open { display:block; }
.theme-panel .tp-title { font-size:13px; font-weight:600; color:var(--text-main); margin-bottom:10px; }
.theme-preset {
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm);
  cursor:pointer; transition:var(--transition); border:1px solid transparent;
}
.theme-preset:hover { background:var(--border-light); }
.theme-preset.active { background:var(--primary-bg); border-color:var(--primary); }
.theme-swatch { width:20px; height:20px; border-radius:50%; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08); }
.theme-preset .theme-name { font-size:13px; color:var(--text-main); }
.theme-preset.active .theme-name { color:var(--primary); font-weight:600; }
.theme-preset .theme-check { margin-left:auto; color:var(--primary); font-size:14px; visibility:hidden; }
.theme-preset.active .theme-check { visibility:visible; }

/* ========== 已选题目购物车（创建试卷侧边悬浮） ========== */
.paper-cart-btn {
  position:fixed; right:20px; bottom:90px; z-index:9990;
  background:var(--primary); color:#fff; border-radius:24px;
  padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,0.25); display:flex; align-items:center; gap:6px;
  border:none; transition:var(--transition);
}
.paper-cart-btn:hover { background:var(--primary-light); transform:translateY(-2px); }
.paper-cart-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:9995; display:none;
}
.paper-cart-overlay.open { display:block; }
.paper-cart-panel {
  position:fixed; top:0; right:0; bottom:0; width:70%; max-width:760px; z-index:10000;
  background:var(--card-bg); box-shadow:-4px 0 24px rgba(0,0,0,0.15);
  transform:translateX(100%); transition:transform 0.3s ease; display:flex; flex-direction:column;
}
.paper-cart-panel.open { transform:translateX(0); }
.paper-cart-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid var(--border-light); font-weight:600; font-size:15px;
}
.paper-cart-body { flex:1; overflow-y:auto; padding:12px 20px; }
.paper-cart-footer { padding:12px 20px; border-top:1px solid var(--border-light); }

#content { flex:1; overflow-y:auto; padding:20px; }
#content .page { display:none; animation:fadeIn 0.3s ease; }
#content .page.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* Mobile overlay */
#sidebarOverlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:99;
}

/* ========== Common Components ========== */
.page-header {
  display:flex; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;
}
.page-header h2 { font-size:20px; font-weight:600; }
.page-header .actions { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }

.card {
  background:var(--card-bg); border-radius:var(--radius); padding:20px; margin-bottom:16px;
  box-shadow:var(--shadow);
}
.card-title {
  font-size:15px; font-weight:600; margin-bottom:16px; padding-bottom:12px;
  border-bottom:1px solid var(--border-light); display:flex; align-items:center; gap:8px;
}
.card-title .actions { margin-left:auto; }

/* Buttons */
.btn {
  display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
  border-radius:var(--radius-sm); font-size:14px; border:1px solid var(--border);
  background:#fff; color:var(--text-main); transition:var(--transition); white-space:nowrap;
}
.btn:hover { border-color:var(--primary); color:var(--primary); }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-light); color:#fff; }
.btn-danger { color:var(--error); border-color:var(--error); }
.btn-danger:hover { background:var(--error); color:#fff; }
.btn-success { color:var(--success); border-color:var(--success); }
.btn-success:hover { background:var(--success); color:#fff; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-lg { padding:12px 24px; font-size:16px; }
.btn-text { border:none; background:none; padding:4px 8px; }
.btn-text:hover { background:var(--primary-bg); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }

/* Tables */
.table-wrap { overflow-x:auto; }
table.data-table {
  width:100%; border-collapse:collapse; font-size:14px; background:#fff; border-radius:var(--radius);
  overflow:hidden;
}
table.data-table th {
  background:#FAFAFA; padding:12px 16px; text-align:left; font-weight:600;
  border-bottom:1px solid var(--border-light); white-space:nowrap;
}
table.data-table td {
  padding:12px 16px; border-bottom:1px solid var(--border-light);
}
table.data-table tr:hover td { background:#FAFAFA; }
table.data-table tr:last-child td { border-bottom:none; }

/* Form controls */
.form-row { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.form-row label { width:100px; text-align:right; color:var(--text-sub); font-size:14px; flex-shrink:0; }
.form-row .form-input { flex:1; min-width:180px; }
input.form-input, select.form-input, textarea.form-input {
  width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
  transition:var(--transition);
}
input.form-input:focus, select.form-input:focus, textarea.form-input:focus {
  border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-bg);
}
textarea.form-input { resize:vertical; min-height:80px; }
.form-inline { display:inline-flex; align-items:center; gap:8px; }

/* Filter bar */
.filter-bar {
  display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;
  padding:16px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
}
.filter-bar .filter-item { display:flex; align-items:center; gap:6px; }
.filter-bar select, .filter-bar input {
  padding:6px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px;
}
.filter-bar .search-input { min-width:200px; }

/* Badges & Tags */
.badge {
  display:inline-flex; align-items:center; padding:2px 8px; border-radius:10px;
  font-size:12px; font-weight:500; gap:4px;
}
.badge-primary { background:var(--primary-bg); color:var(--primary); }
.badge-success { background:var(--success-bg); color:var(--success); }
.badge-warning { background:var(--warning-bg); color:var(--warning); }
.badge-error { background:var(--error-bg); color:var(--error); }
.badge-default { background:#FAFAFA; color:var(--text-sub); }

.tag {
  display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:12px;
  border:1px solid var(--border-light); margin:2px;
}
.tag-blue { background:var(--primary-bg); color:var(--primary); border-color:var(--primary-bg); }
.tag-green { background:var(--success-bg); color:var(--success); border-color:var(--success-bg); }
.tag-orange { background:var(--warning-bg); color:var(--warning); border-color:var(--warning-bg); }
.tag-red { background:var(--error-bg); color:var(--error); border-color:var(--error-bg); }

/* Stat cards */
.stat-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:16px; margin-bottom:20px;
}
.stat-card {
  background:#fff; border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);
  text-align:center; transition:var(--transition);
}
.stat-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
.stat-card .stat-label { font-size:13px; color:var(--text-sub); margin-bottom:8px; }
.stat-card .stat-value { font-size:28px; font-weight:700; color:var(--text-main); }
.stat-card .stat-value .unit { font-size:14px; font-weight:400; color:var(--text-sub); margin-left:4px; }
.stat-card .stat-sub { font-size:12px; margin-top:4px; }
.stat-card .stat-icon { font-size:20px; margin-bottom:4px; }

/* Progress bar */
.progress-bar { width:100%; height:8px; background:var(--border-light); border-radius:4px; overflow:hidden; }
.progress-bar .fill { height:100%; border-radius:4px; transition:width 0.6s ease; }
.progress-bar .fill.blue { background:var(--primary); }
.progress-bar .fill.green { background:var(--success); }
.progress-bar .fill.orange { background:var(--warning); }
.progress-bar .fill.red { background:var(--error); }

/* Modal */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1000;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.show { display:flex; animation:fadeIn 0.2s; }
.modal {
  background:#fff; border-radius:var(--radius); width:600px; max-width:95vw; max-height:90vh;
  display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:zoomIn 0.2s;
}
@keyframes zoomIn { from { transform:scale(0.95); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
.modal-header {
  padding:16px 24px; border-bottom:1px solid var(--border-light);
  display:flex; align-items:center; font-size:16px; font-weight:600;
}
.modal-header .close-btn { margin-left:auto; cursor:pointer; font-size:18px; color:var(--text-sub); background:none; }
.modal-body { padding:24px; overflow-y:auto; flex:1; }
.modal-footer { padding:12px 24px; border-top:1px solid var(--border-light); display:flex; justify-content:flex-end; gap:8px; }

/* Drawer */
.drawer-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1000;
  display:none;
}
.drawer-overlay.show { display:block; animation:fadeIn 0.2s; }
.drawer {
  position:fixed; top:0; right:0; height:100vh; width:480px; max-width:95vw;
  background:#fff; z-index:1001; box-shadow:-6px 0 16px rgba(0,0,0,0.12);
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform 0.3s ease;
}
.drawer.show { transform:translateX(0); }
.drawer-header {
  padding:16px 24px; border-bottom:1px solid var(--border-light);
  display:flex; align-items:center; font-size:16px; font-weight:600;
}
.drawer-header .close-btn { margin-left:auto; cursor:pointer; font-size:18px; color:var(--text-sub); background:none; }
.drawer-body { padding:24px; overflow-y:auto; flex:1; }
.drawer-footer { padding:12px 24px; border-top:1px solid var(--border-light); display:flex; justify-content:flex-end; gap:8px; }

/* Tabs */
.tabs { display:flex; gap:0; border-bottom:1px solid var(--border-light); margin-bottom:16px; overflow-x:auto; }
.tab {
  padding:10px 20px; cursor:pointer; font-size:14px; color:var(--text-sub);
  border-bottom:2px solid transparent; transition:var(--transition); white-space:nowrap;
}
.tab:hover { color:var(--text-main); }
.tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }

/* Steps */
.steps { display:flex; align-items:center; margin-bottom:24px; gap:0; }
.step { display:flex; align-items:center; gap:8px; }
.step .step-num {
  width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:600; border:2px solid var(--border); color:var(--text-sub); background:#fff;
}
.step.active .step-num { border-color:var(--primary); background:var(--primary); color:#fff; }
.step.done .step-num { border-color:var(--success); background:var(--success); color:#fff; }
.step .step-label { font-size:14px; color:var(--text-sub); }
.step.active .step-label { color:var(--primary); font-weight:600; }
.step.done .step-label { color:var(--success); }
.step-line { width:60px; height:2px; background:var(--border); margin:0 8px; }
.step.done + .step-line { background:var(--success); }

/* Mobile prompt */
.mobile-prompt {
  background:var(--warning-bg); border:1px solid var(--warning); border-radius:var(--radius);
  padding:10px 16px; margin-bottom:16px; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--warning);
}
.mobile-prompt .close { margin-left:auto; cursor:pointer; background:none; font-size:16px; }

/* Checkbox */
input[type="checkbox"] { width:16px; height:16px; cursor:pointer; accent-color:var(--primary); }

/* Radio */
input[type="radio"] { cursor:pointer; accent-color:var(--primary); }

/* Pagination */
.pagination { display:flex; align-items:center; justify-content:flex-end; gap:4px; margin-top:16px; }
.pagination button {
  min-width:32px; height:32px; border:1px solid var(--border); background:#fff;
  border-radius:var(--radius-sm); font-size:13px; display:flex; align-items:center; justify-content:center;
}
.pagination button:hover { border-color:var(--primary); color:var(--primary); }
.pagination button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.pagination button:disabled { opacity:0.4; cursor:not-allowed; }

/* Empty state */
.empty-state { text-align:center; padding:40px 20px; color:var(--text-sub); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

/* Answer sheet preview */
.answer-sheet-preview {
  background:#fff; border:1px solid var(--border); padding:30px; border-radius:var(--radius);
  max-width:600px; margin:0 auto; box-shadow:var(--shadow);
}
.answer-sheet-header {
  display:flex; justify-content:space-between; margin-bottom:20px; padding-bottom:12px;
  border-bottom:2px solid var(--text-main); font-size:13px;
}
.answer-sheet-section { margin-bottom:20px; }
.answer-sheet-section h4 { font-size:14px; margin-bottom:12px; }
.answer-sheet-choice { display:flex; gap:20px; margin-bottom:8px; font-size:14px; }
.answer-sheet-choice .choice { display:inline-block; width:20px; height:20px; border:1px solid var(--text-main); border-radius:50%; text-align:center; line-height:18px; font-size:12px; margin-right:4px; }
.answer-sheet-fill { border-bottom:1px solid var(--text-main); display:inline-block; width:200px; height:20px; }
.answer-sheet-essay { border:1px solid var(--text-main); width:100%; min-height:60px; margin-top:4px; }

/* Score input */
.score-input {
  width:60px; padding:4px 8px; border:1px solid var(--border); border-radius:var(--radius-sm);
  text-align:center; font-size:14px;
}
.score-input:focus { border-color:var(--primary); }

/* Knowledge tree */
.tree-node { padding-left:20px; }
.tree-item {
  display:flex; align-items:center; gap:6px; padding:6px 8px; cursor:pointer;
  border-radius:var(--radius-sm); transition:var(--transition);
}
.tree-item:hover { background:var(--border-light); }
.tree-item .tree-icon { font-size:16px; }
.tree-item .tree-label { font-size:14px; }
.tree-item .tree-actions { margin-left:auto; display:none; gap:4px; }
.tree-item:hover .tree-actions { display:flex; }
.tree-children { margin-left:20px; }

/* Dashboard grid */
.dashboard-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;
}
.chart-container { position:relative; height:200px; margin-top:8px; }
.chart-container.tall { height:280px; }

/* ========== Dashboard Redesign ========== */
.dash-welcome {
  background: linear-gradient(135deg, var(--primary) 0%, #4096FF 100%);
  border-radius:12px; padding:24px 28px; margin-bottom:20px;
  display:flex; align-items:center; justify-content:space-between; color:#fff;
  box-shadow:0 4px 14px rgba(22,119,255,0.25);
}
.dash-welcome .welcome-left h2 { font-size:22px; font-weight:700; margin-bottom:6px; }
.dash-welcome .welcome-left p { font-size:13px; opacity:0.85; }
.dash-welcome .welcome-right { text-align:right; }
.dash-welcome .welcome-right .date { font-size:14px; opacity:0.9; }
.dash-welcome .welcome-right .time { font-size:28px; font-weight:700; margin-top:4px; }

.dash-stat-row {
  display:grid; grid-template-columns:repeat(6, 1fr); gap:14px; margin-bottom:20px;
}
.dash-stat {
  background:#fff; border-radius:10px; padding:18px 16px; box-shadow:var(--shadow);
  display:flex; align-items:flex-start; gap:12px; transition:var(--transition);
  border:1px solid var(--border-light);
}
.dash-stat:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
.dash-stat .ds-icon {
  width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:20px; flex-shrink:0;
}
.dash-stat .ds-icon.blue { background:var(--primary-bg); color:var(--primary); }
.dash-stat .ds-icon.green { background:var(--success-bg); color:var(--success); }
.dash-stat .ds-icon.orange { background:var(--warning-bg); color:var(--warning); }
.dash-stat .ds-icon.purple { background:#F9F0FF; color:#722ED1; }
.dash-stat .ds-icon.cyan { background:#E6FFFB; color:#13C2C2; }
.dash-stat .ds-icon.red { background:var(--error-bg); color:var(--error); }
.dash-stat .ds-body { flex:1; min-width:0; }
.dash-stat .ds-label { font-size:12px; color:var(--text-sub); margin-bottom:4px; }
.dash-stat .ds-value { font-size:24px; font-weight:700; line-height:1.2; }
.dash-stat .ds-value .unit { font-size:12px; font-weight:400; color:var(--text-sub); margin-left:2px; }
.dash-stat .ds-trend { font-size:11px; margin-top:4px; display:flex; align-items:center; gap:2px; }
.dash-stat .ds-trend.up { color:var(--success); }
.dash-stat .ds-trend.down { color:var(--error); }

.dash-quick-grid {
  display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;
}
.dash-quick-card {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:20px 12px; border:1px solid var(--border-light); border-radius:10px;
  cursor:pointer; transition:var(--transition); background:#fff; text-align:center;
}
.dash-quick-card:hover { border-color:var(--primary); background:var(--primary-bg); transform:translateY(-2px); }
.dash-quick-card .dq-icon { font-size:28px; }
.dash-quick-card .dq-label { font-size:13px; font-weight:600; color:var(--text-main); }
.dash-quick-card .dq-desc { font-size:11px; color:var(--text-sub); }

.dash-todo-item {
  display:flex; align-items:center; gap:10px; padding:10px 0;
  border-bottom:1px solid var(--border-light);
}
.dash-todo-item:last-child { border-bottom:none; }
.dash-todo-item .dt-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dash-todo-item .dt-text { flex:1; font-size:13px; }
.dash-todo-item .dt-action { font-size:12px; color:var(--primary); cursor:pointer; white-space:nowrap; }

/* Link style for clickable codes */
.code-link {
  font-family:monospace; font-size:12px; color:var(--primary); cursor:pointer;
  text-decoration:none; transition:var(--transition);
}
.code-link:hover { text-decoration:underline; font-weight:600; }

@media (max-width: 1200px) {
  .dash-stat-row { grid-template-columns:repeat(3, 1fr); }
}
@media (max-width: 768px) {
  .dash-stat-row { grid-template-columns:repeat(2, 1fr); }
  .dash-quick-grid { grid-template-columns:repeat(2, 1fr); }
  .dash-welcome { flex-direction:column; gap:12px; text-align:center; }
  .dash-welcome .welcome-right { text-align:center; }
}
.chart-container.small { height:160px; }

/* Score distribution bars */
.dist-bar { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; }
.dist-bar .label { width:80px; text-align:right; color:var(--text-sub); }
.dist-bar .bar { flex:1; height:20px; background:var(--border-light); border-radius:4px; overflow:hidden; }
.dist-bar .bar .fill { height:100%; border-radius:4px; transition:width 0.6s; }
.dist-bar .count { width:60px; font-weight:600; }

/* Upload area */
.upload-area {
  border:2px dashed var(--border); border-radius:var(--radius); padding:40px;
  text-align:center; cursor:pointer; transition:var(--transition); margin-bottom:16px;
}
.upload-area:hover { border-color:var(--primary); background:var(--primary-bg); }
.upload-area .icon { font-size:48px; color:var(--text-sub); margin-bottom:12px; }
.upload-area .text { font-size:14px; color:var(--text-sub); }
.upload-area .hint { font-size:12px; color:var(--text-disabled); margin-top:8px; }

/* 智能导入：拖拽高亮 + 文件处理队列 */
.upload-area.smart-drop.dragover { border-color:var(--primary); background:var(--primary-bg); box-shadow:0 0 0 3px rgba(24,144,255,.15) inset; }
.smart-import-item { border:1px solid var(--border-light); border-radius:var(--radius-sm); padding:8px 12px; margin-bottom:8px; background:#FAFAFA; }
.smart-import-item .line1 { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.smart-import-item .fname { font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%; }
.smart-import-item .status { font-size:12px; white-space:nowrap; }
.smart-import-item .status.ok { color:var(--success); font-weight:600; }
.smart-import-item .status.err { color:var(--error); font-weight:600; }

.photo-preview { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
.photo-thumb {
  width:100px; height:100px; border:1px solid var(--border); border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center; background:#FAFAFA; position:relative;
}
.photo-thumb .remove { position:absolute; top:2px; right:2px; cursor:pointer; }

/* Student card (mobile table) */
.card-list-item {
  background:#fff; border-radius:var(--radius); padding:16px; margin-bottom:12px;
  box-shadow:var(--shadow); border-left:3px solid var(--primary);
}
.card-list-item .item-header { display:flex; align-items:center; margin-bottom:8px; }
.card-list-item .item-header .title { font-weight:600; font-size:15px; }
.card-list-item .item-header .badge { margin-left:auto; }
.card-list-item .item-meta { font-size:13px; color:var(--text-sub); display:flex; flex-wrap:wrap; gap:8px; }

/* Timeline */
.timeline { padding-left:20px; border-left:2px solid var(--border-light); }
.timeline-item { margin-bottom:16px; position:relative; }
.timeline-item::before {
  content:''; position:absolute; left:-26px; top:4px; width:10px; height:10px;
  border-radius:50%; background:var(--primary); border:2px solid #fff;
}
.timeline-item .timeline-date { font-size:12px; color:var(--text-sub); }
.timeline-item .timeline-content { font-size:14px; margin-top:4px; }

/* Responsive */
@media (max-width: 768px) {
  :root { --sidebar-w: 240px; }
  #sidebar { position:fixed; left:0; top:0; height:100vh; transform:translateX(-100%); }
  #sidebar.show { transform:translateX(0); }
  #header .menu-toggle { display:block; }
  #sidebarOverlay.show { display:block; }
  .page-header h2 { font-size:17px; }
  .filter-bar { flex-direction:column; align-items:stretch; }
  .filter-bar .filter-item { width:100%; }
  .filter-bar select, .filter-bar input { width:100%; }
  .stat-grid { grid-template-columns:repeat(2, 1fr); }
  .stat-card .stat-value { font-size:22px; }
  .form-row { flex-direction:column; align-items:stretch; }
  .form-row label { width:100%; text-align:left; }
  .form-row .form-input { width:100%; }
  .modal { width:95vw; }
  .drawer { width:100vw; }
  .table-mobile-hide { display:none; }
  .steps { flex-wrap:wrap; gap:8px; }
  .step-line { display:none; }
  #content { padding:12px; }
  .card { padding:14px; }
  #header { padding:0 12px; }
  #header .breadcrumb { font-size:13px; }
  .dashboard-grid { grid-template-columns:1fr; }
  .chart-container { height:180px; }
}

@media (min-width: 769px) {
  .mobile-only { display:none !important; }
}
@media (max-width: 768px) {
  .pc-only { display:none !important; }
}

/* ===== 同步教研云 ===== */
.sync-tip { background:var(--info-bg,#E8F3FF); border:1px solid var(--info,#91CAFF); color:var(--text-sub);
  font-size:13px; padding:10px 12px; border-radius:6px; margin:12px 0; }
.sync-filter-grid { display:flex; flex-wrap:wrap; gap:12px; }
.sync-filter-grid .sf { display:flex; flex-direction:column; gap:4px; min-width:150px; flex:1; }
.sync-filter-grid .sf label { font-size:12px; color:var(--text-sub); }
.sync-filter-grid .sf select, .sync-filter-grid .sf input { padding:7px 9px; border:1px solid var(--border,#E5E7EB);
  border-radius:6px; font-size:14px; background:#fff; }
.sync-quality { display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--border,#E5E7EB); }
.sync-quality .qflag { font-size:13px; color:var(--text-sub); display:flex; align-items:center; gap:4px; cursor:pointer; }
</style>
</head>

<script>
/* ================================================================
   MOCK DATA
   ================================================================ */
const DATA = {
  // 基础数据
  subjects: [
    { id:'s1', code:'MAT', name:'数学' },
    { id:'s2', code:'CHN', name:'语文' },
    { id:'s3', code:'ENG', name:'英语' },
    { id:'s4', code:'PHY', name:'物理' },
    { id:'s5', code:'CHM', name:'化学' },
  ],
  grades: [
    { id:'g1', code:'G1', name:'一年级', stage:'primary' },
    { id:'g2', code:'G2', name:'二年级', stage:'primary' },
    { id:'g3', code:'G3', name:'三年级', stage:'primary' },
    { id:'g7', code:'G7', name:'初一', stage:'middle' },
    { id:'g8', code:'G8', name:'初二', stage:'middle' },
    { id:'g9', code:'G9', name:'初三', stage:'middle' },
    { id:'g10', code:'G10', name:'高一', stage:'high' },
    { id:'g11', code:'G11', name:'高二', stage:'high' },
  ],
  questionTypes: [
    { code:'single_choice', name:'单选题', short:'单选' },
    { code:'multi_choice', name:'多选题', short:'多选' },
    { code:'fill_blank', name:'填空题', short:'填空' },
    { code:'true_false', name:'判断题', short:'判断' },
    { code:'essay', name:'解答题', short:'解答' },
  ],
  difficulties: [
    { level:1, name:'容易' },
    { level:2, name:'较易' },
    { level:3, name:'中等' },
    { level:4, name:'较难' },
    { level:5, name:'困难' },
  ],
  // 标签（可给题目打多个标签，用于筛选）
  tags: [
    { id:'tg1', name:'易错题', color:'red' },
    { id:'tg2', name:'高频考点', color:'blue' },
    { id:'tg3', name:'真题', color:'orange' },
    { id:'tg4', name:'压轴题', color:'green' },
    { id:'tg5', name:'计算训练', color:'blue' },
  ],
  knowledgeTree: {},

  // 分类（去 mock：由 api-bridge 从后端加载）
  questionBankCategories: [],
  paperCategories: [],
  taskCategories: [],

  // 题目（去 mock：由 api-bridge 从后端真实落表数据加载）
  questions: [],

  // 试卷（去 mock）
  papers: [],

  // 班级（去 mock：由 api-bridge 从后端加载）
  classes: [],

  // 学生（去 mock）
  students: [],

  // 教师（去 mock）
  teachers: [],

  // 考试任务（去 mock）
  tasks: [],

  // 答题卡上传记录（去 mock）
  answerSheets: [],

  // 每题评分（去 mock）
  questionScores: [],

  // 导入日志
  importLogs: [],

  // 用户（去 mock：由 api-bridge 从后端加载）
  users: [],
};

/* ================================================================
   STATE & ROUTER
   ================================================================ */
// 云端环境（非本机）：教研云同步代理(8787)仅本机可用，云端不支持
const IS_CLOUD = (typeof location !== 'undefined') && (location.hostname !== '127.0.0.1') && (location.hostname !== 'localhost');
let STATE = {
  role: 'admin',
  userName: '管理员',
  currentRoute: 'dashboard',
  selectedQuestions: [],
  paperCreateStep: 1,
  paperCreateFilters: { subject:'', grade:'', quesType:'', difficulty:'', knowledge:'', category:'', keyword:'' },
  paging: {},
  charts: {},
  theme: 'default',
  // 全局用户作用域：当前登录用户 + 绑定教师 + 授权班级
  currentUserId: null,
  teacherId: null,
  authorizedClassIds: [],
  // 模块权限（任务10）：{module:[view,add,edit,delete]}；admin 为 null=全量
  permissions: null,
};

// 模块权限判断（任务10）：admin 恒 true；无权限数据（离线/旧数据）按全量兼容
function hasPerm(module, action) {
  if (STATE.role === 'admin') return true;
  const p = STATE.permissions;
  // 权限对象缺失时：非 admin 默认不给敏感权限（保守，避免越权可见菜单）
  if (!p || typeof p !== 'object') return false;
  const acts = p[module];
  if (!Array.isArray(acts)) return false;
  if (!action) return acts.length > 0;
  return acts.indexOf(action) >= 0;
}

/* ================================================================
   主题系统（Vben Admin V5 风格主题色预设）
   ================================================================ */
const THEME_PRESETS = [
  { key:'default', name:'默认蓝', color:'#1677FF', light:'#4096FF', bg:'#E6F4FF' },
  { key:'purple', name:'紫罗兰', color:'#722ED1', light:'#9254DE', bg:'#F9F0FF' },
  { key:'green', name:'青绿', color:'#16A34A', light:'#22C55E', bg:'#F0FDF4' },
  { key:'cyan', name:'青色', color:'#13C2C2', light:'#36CFC9', bg:'#E6FFFB' },
  { key:'red', name:'红色', color:'#F5222D', light:'#FF4D4F', bg:'#FFF1F0' },
  { key:'orange', name:'橙色', color:'#FA8C16', light:'#FFA940', bg:'#FFF7E6' },
  { key:'volcano', name:'朱红', color:'#FA541C', light:'#FF7A45', bg:'#FFF2E8' },
  { key:'pink', name:'粉色', color:'#EB2F96', light:'#F759AB', bg:'#FFF0F6' },
];

function applyTheme(key, persist) {
  const p = THEME_PRESETS.find(t => t.key === key) || THEME_PRESETS[0];
  const root = document.documentElement;
  root.style.setProperty('--primary', p.color);
  root.style.setProperty('--primary-light', p.light);
  root.style.setProperty('--primary-bg', p.bg);
  root.style.setProperty('--sidebar-active', p.color);
  STATE.theme = p.key;
  if (persist !== false) { try { localStorage.setItem('app_theme', p.key); } catch (e) {} }
  const dot = document.getElementById('themeDot');
  if (dot) dot.style.background = p.color;
  renderThemePanel();
}

function renderThemePanel() {
  const panel = document.getElementById('themePanel');
  if (!panel) return;
  const cur = STATE.theme || 'default';
  panel.innerHTML = '<div class="tp-title">主题色</div>' + THEME_PRESETS.map(p => `
    <div class="theme-preset ${p.key === cur ? 'active' : ''}" onclick="applyTheme('${p.key}')">
      <span class="theme-swatch" style="background:${p.color};"></span>
      <span class="theme-name">${p.name}</span>
      <span class="theme-check">✓</span>
    </div>`).join('');
}

function toggleThemePanel(e) {
  if (e) e.stopPropagation();
  const panel = document.getElementById('themePanel');
  if (!panel) return;
  const willOpen = !panel.classList.contains('open');
  panel.classList.toggle('open', willOpen);
}

// 点击面板外部关闭主题面板
document.addEventListener('click', function(e) {
  const sw = document.getElementById('themeSwitcher');
  if (sw && !sw.contains(e.target)) {
    const panel = document.getElementById('themePanel');
    if (panel) panel.classList.remove('open');
  }
});

// 启动时从 localStorage 恢复上次选择的主题色
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('app_theme'); } catch (e) {}
  if (saved && THEME_PRESETS.some(t => t.key === saved)) applyTheme(saved, false);
  else { renderThemePanel(); const d = document.getElementById('themeDot'); if (d) d.style.background = THEME_PRESETS[0].color; }
})();

// 分页状态辅助：取/初始化某列表的分页状态
function _pg(key) {
  if (!STATE.paging[key]) STATE.paging[key] = { page: 1, pageSize: 10 };
  return STATE.paging[key];
}

// 可复用分页器：返回 HTML 字符串，prev/next + 页码 + 每页大小选择器 + 总数
// onChange: 字符串形式的全局函数名，调用 onChange(newPage, newPageSize)
function renderPager({ total, page, pageSize, onChange, pageSizes }) {
  pageSize = parseInt(pageSize, 10) || 10;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (page > totalPages) page = totalPages;
  if (page < 1) page = 1;
  // 页码显示：≤7 全显示；否则显示首尾+当前附近+省略号
  const nums = [];
  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) nums.push(i);
  } else {
    nums.push(1, 2);
    if (page > 4) nums.push('...');
    for (let i = Math.max(3, page - 1); i <= Math.min(totalPages - 2, page + 1); i++) nums.push(i);
    if (page < totalPages - 3) nums.push('...');
    nums.push(totalPages - 1, totalPages);
  }
  const numBtns = nums.map(n =>
    n === '...' ? `<span style="padding:0 6px;color:var(--text-sub);">…</span>` :
    `<button class="${n===page?'active':''}" onclick="${onChange}(${n}, ${pageSize})">${n}</button>`
  ).join('');
  const prev = page > 1 ? `<button onclick="${onChange}(${page-1}, ${pageSize})">上一页</button>` : `<button disabled>上一页</button>`;
  const next = page < totalPages ? `<button onclick="${onChange}(${page+1}, ${pageSize})">下一页</button>` : `<button disabled>下一页</button>`;
  const opts = (pageSizes || [10, 20, 50]).map(n => `<option value="${n}" ${pageSize===n?'selected':''}>${n}</option>`).join('');
  return `
    <div class="pagination">
      ${prev}
      ${numBtns}
      ${next}
      <span style="margin-left:8px;font-size:13px;color:var(--text-sub);">共 ${total} 条 · 每页
        <select onchange="${onChange}(1, this.value)" style="padding:2px 6px;margin:0 4px;border:1px solid var(--border);border-radius:4px;">
          ${opts}
        </select> 条
      </span>
    </div>
  `;
}

function navigate(route, params={}) {
  STATE.currentRoute = route;
  STATE.routeParams = params;
  const r = ROUTES[route];
  if (!r) { navigate('dashboard'); return; }

  // Update breadcrumb（子页面统一注入返回上级按钮；system.* 返回工作台）
  const bc = document.getElementById('breadcrumb');
  const parentRoute = route.indexOf('.') >= 0 ? route.split('.')[0] : null;
  if (parentRoute) {
    const backRoute = parentRoute === 'system' ? 'dashboard' : parentRoute;
    const backTitle = ROUTES[backRoute] ? ROUTES[backRoute].title : '返回';
    bc.innerHTML = `<button class="btn btn-sm btn-text" style="padding:2px 8px;font-weight:600;" onclick="navigate('${backRoute}')">← ${backTitle}</button><span style="margin:0 8px;color:var(--text-sub);">/</span>${r.menu} <span style="color:var(--text-sub);">/ ${r.title}</span>`;
  } else {
    bc.innerHTML = `${r.menu} <span style="color:var(--text-sub);">/ ${r.title}</span>`;
  }

  // Update nav active
  document.querySelectorAll('#sidebarNav .nav-item, #sidebarNav .nav-child-item').forEach(el => el.classList.remove('active'));
  const navItem = document.querySelector(`#sidebarNav [data-route="${route}"]`);
  if (navItem) navItem.classList.add('active');

  // Render page
  document.getElementById('content').innerHTML = `<div class="page active" id="pageContent">${r.render(params)}</div>`;

  // Post-render hooks (charts, etc.)
  if (r.afterRender) r.afterRender(params);
  if (window.postRender) window.postRender(route, params);

  // Close mobile sidebar
  if (window.innerWidth < 768) {
    document.getElementById('sidebar').classList.remove('show');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }

  // Scroll to top
  document.getElementById('content').scrollTop = 0;
}

// 根据用户绑定的教师，解析其授权的班级 id 列表（供数据隔离/权限判断）
function resolveAuthorizedClassIds(user) {
  if (!user || !user.teacherId) return [];
  const teacher = DATA.teachers.find(t => t.id === user.teacherId);
  if (!teacher) return [];
  return (teacher.classes || []).map(c => c.classId).filter(Boolean);
}

// 登录后设置全局用户作用域：当前用户 + 绑定教师 + 授权班级（供任意地方全局读取）
function setupUserScope(user) {
  STATE.currentUserId = user ? user.id : null;
  STATE.teacherId = (user && user.role === 'teacher') ? (user.teacherId || null) : null;
  STATE.authorizedClassIds = resolveAuthorizedClassIds(user);
  // 同时暴露到 window，方便全局读取
  window._currentUserId = STATE.currentUserId;
  window._teacherId = STATE.teacherId;
  window._authorizedClassIds = STATE.authorizedClassIds;
}

function _enterApp() {
  // 设置全局用户作用域（当前用户 + 绑定教师 + 教师授权班级）
  const curUser = DATA.users.find(u => u.role === STATE.role && u.name === STATE.userName)
    || DATA.users.find(u => u.role === STATE.role);
  setupUserScope(curUser);
  document.getElementById('loginPage').style.display = 'none';

/* 离线回退：后端未连接时提示 */
function _fallbackLogin() {
  STATE.userName = STATE.role === 'admin' ? '管理员' : '王老师';
  // 回退时若未加载权限：非 admin 给默认权限集（除 user/system 外全部 view+add+edit），保证菜单可见可用
  if (STATE.role !== 'admin' && (!STATE.permissions || typeof STATE.permissions !== 'object')) {
    const def = {};
    PERM_MODULES.forEach(m => {
      if (m.key === 'user' || m.key === 'system') return;
      def[m.key] = ['view', 'add', 'edit'];
    });
    STATE.permissions = def;
  }
  _enterApp();
  const isLocal = (typeof location !== 'undefined') && (location.hostname === '127.0.0.1' || location.hostname === 'localhost');
  showToast(isLocal
    ? '⚠️ 后端未连接：请先启动后端（backend/venv/Scripts/python.exe -m uvicorn app.main:app --host 127.0.0.1 --port 8000），当前为离线模式，数据不会保存'
    : '⚠️ 后端未连接，无法加载数据：请稍后刷新重试，或检查服务器服务状态', 'warning');
}

async function doLogin() {
  const username = (document.getElementById('loginUser').value || '').trim();
  const password = (document.getElementById('loginPass').value || '');
  // 1. 尝试真实后端登录（apiLogin 区分 401 密码错 / 网络错误）
  const login = (typeof window.apiLogin === 'function') ? await window.apiLogin('/auth/login', { username, password }) : null;
  if (login && login.ok && login.data && login.data.access_token) {
    const resp = login.data;
    setApiToken(resp.access_token);
    STATE.role = resp.role || STATE.role;
    STATE.userName = resp.name || (STATE.role === 'admin' ? '管理员' : '王老师');
    // 模块权限（任务10）：admin 为 null 视为全量
    STATE.permissions = (STATE.role === 'admin') ? null : (resp.permissions || null);
    // 持久化登录态（刷新不掉登录 + 保留权限，避免刷新后权限丢失误显示菜单）
    try {
      localStorage.setItem('wb_auth_info', JSON.stringify({ role: STATE.role, name: STATE.userName, permissions: STATE.permissions }));
    } catch (e) {}
    _enterApp();
    // 从后端加载真实落表数据（题目/试卷/班级/学生/教师/任务/分类/用户等）
    try { await loadBackendData(); } catch (e) { /* 保留空数据 */ }
    // 合并本地暂存题目（后端不可用时批量添加的兜底数据），防止刷新丢失
    try { restoreLocalQuestions(); } catch (e) {}
    // 数据加载完成后重渲染当前页（避免工作台一直显示 0）
    try { navigate(STATE.currentRoute || 'dashboard'); } catch (e) {}
    return;
  }
  // 2. 失败分类提示：401 = 密码错误；0/network = 后端未连接；其它 = 服务异常
  if (login && login.status === 401) {
    showToast('账号或密码错误，请重试', 'error');
    return;
  }
  if (login && login.status !== 0 && login.status !== undefined) {
    showToast('登录失败（HTTP ' + login.status + '）：' + (login.message || '服务异常'), 'error');
    return;
  }
  _fallbackLogin();
}

function doLogout() {
  if (typeof window.setApiToken === 'function') window.setApiToken(null);
  try { localStorage.removeItem('wb_auth_info'); } catch (e) {}
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  STATE.role = 'admin';
  STATE.permissions = null;
}

function getTypeName(code) {
  return DATA.questionTypes.find(t => t.code === code)?.short || code;
}
function stripHtml(html) {
  if (!html) return '';
  // 公式 SVG 整体替换为 [公式]，避免 MathJax 的 \bigtriangleup 等 LaTeX 裸文本漏出
  let h = String(html).replace(/<svg[\s\S]*?<\/svg>/gi, ' [公式] ');
  const div = document.createElement('div');
  div.innerHTML = h;
  return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
}
// 题干预览：纯文本 + 若题干含图片则追加小缩略图（列表页能看到"如图"的图）
function stemPreviewHtml(q) {
  const stem = (q && q.stem) || '';
  const text = stripHtml(stem);
  const imgs = String(stem).match(/<img[^>]+src="([^"]+)"/g) || [];
  let html = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%;vertical-align:middle;">${text || '（空题干）'}</span>`;
  if (imgs.length) {
    const srcs = imgs.map(m => (m.match(/src="([^"]+)"/) || [])[1]).filter(Boolean);
    html += srcs.map(s => `<img src="${fixImgSrc(s)}" style="max-height:36px;max-width:60px;vertical-align:middle;margin-left:6px;border-radius:3px;border:1px solid var(--border-light);">`).join('');
  }
  return html;
}
// 图片 src 补全：docx 导入的历史数据用相对路径 images/xxx.png，统一补为 /images/xxx.png（nginx 站点根）
function fixImgSrc(src) {
  if (!src) return src;
  const s = String(src);
  if (/^(https?:|data:|\/)/i.test(s)) return s;  // 绝对路径/外链/协议相对不变
  if (s.indexOf('images/') === 0) return '/' + s;  // images/xxx.png → /images/xxx.png
  return s;
}
function fixStemImg(html) {
  if (!html) return html;
  return String(html).replace(/<img([^>]*)src="([^"]+)"/gi, (m, attrs, src) => `<img${attrs}src="${fixImgSrc(src)}"`);
}
// 选项/答案等对象字段安全转字符串：取 label/content/text/value，禁止 [object Object]
function safeStr(o) {
  if (o == null) return '';
  if (typeof o === 'string') return o;
  if (typeof o === 'number' || typeof o === 'boolean') return String(o);
  if (Array.isArray(o)) return o.map(safeStr).filter(Boolean).join(' ');
  if (typeof o === 'object') {
    const parts = [];
    if (o.label != null) parts.push(o.label);
    if (o.content != null) parts.push(typeof o.content === 'string' ? o.content : safeStr(o.content));
    if (o.text != null) parts.push(typeof o.text === 'string' ? o.text : safeStr(o.text));
    if (o.value != null) parts.push(typeof o.value === 'string' ? o.value : safeStr(o.value));
    if (!parts.length) { try { return JSON.stringify(o); } catch (e) { return String(o); } }
    return parts.join('. ').replace(/^[.:]+\s*/, '');
  }
  try { return JSON.stringify(o); } catch (e) { return String(o); }
}
function getTaskStatusBadge(status) {
  const map = {
    draft:{name:'草稿',cls:'badge-default'},
    pending:{name:'待考试',cls:'badge-primary'},
    in_exam:{name:'考试中',cls:'badge-warning'},
    scoring:{name:'评分中',cls:'badge-warning'},
    completed:{name:'已完成',cls:'badge-success'},
    voided:{name:'已作废',cls:'badge-error'},
  };
  const s = map[status] || {name:status,cls:'badge-default'};
  return `<span class="badge ${s.cls}">${s.name}</span>`;
}
function getPaperStatusBadge(status) {
  const map = { draft:'草稿', active:'启用', archived:'已归档' };
  const cls = { draft:'badge-default', active:'badge-success', archived:'badge-error' };
  return `<span class="badge ${cls[status]}">${map[status]}</span>`;
}
function getMobilePrompt(text) {
  if (window.innerWidth >= 768) return '';
  return `<div class="mobile-prompt"><span>💡 ${text}</span><button class="close" onclick="this.parentElement.style.display='none'">×</button></div>`;
}
function isMobile() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
}

/* ---------- 教研云登录态（页面输入账号密码 -> 保存到服务器 -> 捕获令牌驱动所有爬取/查询）---------- */
function syncCheckAuth() {
  const badge = document.getElementById('syncAuthBadge');
  const mbadge = document.getElementById('syncModeBadge');
  const btn = document.getElementById('syncLoginBtn');
  const rbtn = document.getElementById('syncRestartChromeBtn');
  fetch(SYNC_API + '/api/auth').then(r => r.json()).then(d => {
    window._syncAuth = d;
    if (badge) {
      if (d.authed) { badge.textContent = '● 已登录(' + (d.username || '教研云') + ')'; badge.className = 'badge badge-primary'; }
      else { badge.textContent = '○ 未登录'; badge.className = 'badge badge-warning'; }
    }
    // 服务状态徽章：代理在线(live) / 代理在线但无CDP(离线) / 代理未连接
    if (mbadge) {
      if (d.mode === 'live') { mbadge.textContent = '● 实时教研云'; mbadge.className = 'badge badge-primary'; }
      else if (d.hasCdp === false) { mbadge.textContent = '● 离线缓存(无Chrome)'; mbadge.className = 'badge badge-default'; }
      else { mbadge.textContent = '● 离线缓存'; mbadge.className = 'badge badge-default'; }
    }
    if (btn) {
      if (d.authed) { btn.textContent = '退出'; btn.setAttribute('onclick', 'syncLogoutLogin()'); }
      else { btn.textContent = '🔑 登录'; btn.setAttribute('onclick', 'syncShowLogin()'); }
    }
    // 仅当检测不到本机 Chrome(CDP 9222) 且是本机环境时显示「重启 Chrome」按钮（云端无本机 Chrome）
    if (rbtn) { rbtn.style.display = (d.hasCdp === false && !IS_CLOUD) ? 'inline-block' : 'none'; }
    if (!d.authed) syncShowLogin(d);
  }).catch(() => {
    if (badge) { badge.textContent = '○ 代理未连接'; badge.className = 'badge badge-default'; }
    if (mbadge) { mbadge.textContent = '● 代理未连接'; mbadge.className = 'badge badge-default'; }
    if (rbtn) { rbtn.style.display = 'none'; }
  });
}

function syncRestartChrome() {
  const rbtn = document.getElementById('syncRestartChromeBtn');
  if (rbtn) { rbtn.textContent = '🔄 重启中…'; rbtn.disabled = true; }
  showToast('正在重启本机 Chrome（CDP 9222）…');
  fetch(SYNC_API + '/api/chrome/restart', { method: 'POST' })
    .then(r => r.json()).then(d => {
      if (d.ok && d.cdp_reachable) showToast('✅ Chrome 已重启并在线');
      else if (d.ok) showToast('⚠ Chrome 已启动，但 CDP 尚未就绪，稍后再试');
      else showToast('❌ 重启失败：' + (d.error || '未知错误'));
      setTimeout(syncCheckAuth, 2500);
    })
    .catch(() => { showToast('❌ 重启请求失败（代理未连接）'); })
    .finally(() => { if (rbtn) { rbtn.textContent = '🔄 重启 Chrome'; rbtn.disabled = false; } });
}

  fetch(SYNC_API + '/api/sync-logs?limit=200').then(r => r.json()).then(d => {

function syncGather() {
  const F = window.JIAOYANYUN_FILTERS || {};
  const ggName = document.getElementById('sf_gg').value;
  const subj = document.getElementById('sf_sub').value;
  const f = {
    subjectId: SUBJECT_ID[subj] || '2',
    gradeGroupId: GRADE_GROUP_ID[ggName] || '2',
    subjectName: subj || '数学',
    gradeGroupName: ggName || '初中',
    writtenQuesTypeId: document.getElementById('sf_wqt').value,
    difficultyId: document.getElementById('sf_diff').value,
    examTypeId: document.getElementById('sf_exam').value,
    cupId: document.getElementById('sf_cup').value,
    provinceId: document.getElementById('sf_prov').value,
    schoolYearId: document.getElementById('sf_sy').value,
    semesterId: document.getElementById('sf_sem').value,
    gradeId: document.getElementById('sf_grade').value,
    bookSeries: document.getElementById('sf_book').value,
    bookVolume: (document.getElementById('sf_bookvol') || {}).value || '',
    knowledge: document.getElementById('sf_kp').value,
    keyword: document.getElementById('sf_kw').value,
    sort: document.getElementById('sf_sort').value,
    quality: {},
  };
  document.querySelectorAll('.sync-quality input[data-qf]').forEach(c => { if (c.checked) f.quality[c.dataset.qf] = 1; });
  return f;
}
function syncQueryString(f, pageNo, pageSize) {
  const p = new URLSearchParams();
  p.set('subjectId', f.subjectId); p.set('gradeGroupId', f.gradeGroupId);
  p.set('subjectName', f.subjectName); p.set('gradeGroupName', f.gradeGroupName);
  p.set('pageNo', pageNo || 1); p.set('pageSize', pageSize || 50);
  const map = { writtenQuesTypeId: 'writtenQuesTypeId', difficultyId: 'difficultyId', examTypeId: 'examTypeId',
    cupId: 'cupId', provinceId: 'provinceId', schoolYearId: 'schoolYearId', semesterId: 'semesterId',
    gradeId: 'gradeId', bookSeries: 'bookSeries', knowledge: 'knowledge', keyword: 'keyword' };
  for (const k in map) { if (f[k]) p.set(map[k], f[k]); }
  if (f.bookVolume) p.set('bookVolume', f.bookVolume);
  for (const k in (f.quality || {})) { if (f.quality[k]) p.set(k, 1); }
  return p.toString();
}
function syncClientFilter(items, f) {
  const WQT = (window.JIAOYANYUN_FILTERS || {}).writtenQuesTypes || [];
  return items.filter(q => {
    if (f.writtenQuesTypeId) {
      const wt = WQT.find(t => t.id === f.writtenQuesTypeId);
      if (!(wt && q.writtenType && q.writtenType.indexOf(wt.name) >= 0)) return false;
    }
    if (f.difficultyId && String(q.difficulty) !== String(f.difficultyId)) return false;
    if (f.knowledge && !((q.knowledgePoints || []).join(' ').indexOf(f.knowledge) >= 0)) return false;
    if (f.keyword) { const hay = (q.stem || '') + ' ' + (q.positionCode || ''); if (hay.indexOf(f.keyword) < 0) return false; }
    if (f.quality && f.quality.hasImage && !/<img|images\/|tiku-pro-cdn/.test(q.stem || '')) return false;
    if (f.quality && f.quality.isHaveAnalysis && !(q.analysis || '').trim()) return false;
    if (f.quality && f.quality.isSubjective && ['single_choice','multi_choice','judge','fill_blank'].indexOf(q.type) >= 0) return false;
    return true;
  });
}
function syncSearch(pageNo, pageSize) {
  const pg = _pg('sync');
  // 同步教研云默认每页 50 条（教研云接口单页上限 10，由后端聚合翻页凑满）
  if (!STATE.paging.sync) STATE.paging.sync = { page: 1, pageSize: 50 };
  if (pageNo != null) pg.page = parseInt(pageNo, 10) || 1;
  if (pageSize != null) pg.pageSize = parseInt(pageSize, 10) || 50;
  pageNo = pg.page;
  pageSize = pg.pageSize;
  const f = syncGather();
  const qs = syncQueryString(f, pageNo, pageSize);
  document.getElementById('syncTable').querySelector('tbody').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;">搜索中…</td></tr>';
  fetch(SYNC_API + '/api/search?' + qs).then(r => r.json()).then(d => {
    window._syncAllItems = d.questions || [];          // 当前页（在线模式）或全量（离线模式）
    window._syncTotal = d.total || 0;
    renderSyncResults(d.questions || [], d.mode || 'offline', d.total || 0, pageNo, d.pageSize || pageSize);
    const badge = document.getElementById('syncModeBadge');
    if (badge) { badge.textContent = d.mode === 'live' ? '● 实时教研云' : '● 离线缓存'; badge.className = 'badge ' + (d.mode === 'live' ? 'badge-primary' : 'badge-default'); }
  }).catch(() => {
    const cache = window.JIAOYANYUN_CACHE || [];
    const items = syncClientFilter(cache, f);
    window._syncAllItems = items;
    window._syncTotal = items.length;
    renderSyncResults(items, 'offline-cache', items.length, pageNo, pageSize);
    const badge = document.getElementById('syncModeBadge');
    if (badge) { badge.textContent = '● 离线缓存(无代理)'; badge.className = 'badge badge-default'; }
  });
}
function syncResultId(q) { return q.positionCode || q.code || q.queId || ''; }
function renderSyncResults(items, mode, total, pageNo, pageSize) {
  // 'offline-cache' = 代理未启动，客户端从 window.JIAOYANYUN_CACHE 全量筛选后传入（需要客户端切片）
  // 'offline' / 'live' = 代理已返回单页结果，无需再切片
  const isClientSidePaged = mode === 'offline-cache';
  const allItems = items || [];
  const displayItems = isClientSidePaged
    ? allItems.slice((pageNo - 1) * pageSize, pageNo * pageSize)
    : allItems;
  // _syncLast 保存当前可见页的题目，供 syncFind 查找（按 queId/positionCode）
  window._syncLast = displayItems;
  window._syncMap = window._syncMap || {};
  const tb = document.getElementById('syncTable').querySelector('tbody');
  if (!displayItems.length) { tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-sub);">无匹配题目</td></tr>'; }
  else {
    tb.innerHTML = displayItems.map(q => {
      const id = syncResultId(q);
      window._syncMap[id] = q;
      return `
      <tr id="syncrow-${id}">
        <td><input type="checkbox" class="sync-checkbox" value="${id}" onchange="syncUpdateCount()"></td>
        <td style="font-size:12px;font-family:monospace;">${id}</td>
        <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${stemPreviewHtml(q)}</td>
        <td><span class="badge badge-primary">${q.writtenType || getTypeName(q.type)}</span></td>
        <td>${getDifficultyBadge(q.difficulty)}</td>
        <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;">${(q.knowledgePoints || []).join('、') || (q.knowledge || '')}</td>
        <td class="table-mobile-hide">${Array.isArray(q.source) ? q.source.join('/') : (q.source || '教研云')}</td>
        <td>
          <button class="btn btn-sm btn-text" onclick="showSyncDetailById('${id}')">详情</button>
          <button class="btn btn-sm btn-text btn-primary" id="addbtn-${id}" onclick="syncAddOne('${id}')">添加到题库</button>
        </td>
      </tr>`;
    }).join('');
  }
  const cnt = document.getElementById('syncCount');
  if (cnt) {
    const n = document.querySelectorAll('.sync-checkbox:checked').length;
    cnt.textContent = '共 ' + total + ' 条（本页 ' + displayItems.length + '，已选 ' + n + '）';
  }
  // 重置本页全选框
  const sa = document.getElementById('syncSelectAll');
  if (sa) sa.checked = false;
  // 复用 renderPager：onChange 调 syncPageChange
  const pager = document.getElementById('syncPager');
  if (pager) {
    pager.innerHTML = renderPager({ total, page: pageNo, pageSize, onChange: 'syncPageChange' });
  }
}

// 把教研云题目对象映射为 DATA.questions 中的题目形状
function mapSyncItemToQuestion(item) {
  const writtenType = item.writtenType || item.bizType || '';
  // 教研云 writtenType 名 / type 简写 → 本系统 type code
  const typeMap = { '单选题':'single_choice','单选':'single_choice','single':'single_choice','single_choice':'single_choice',
    '多选题':'multi_choice','多选':'multi_choice','multi':'multi_choice','multi_choice':'multi_choice',
    '填空题':'fill_blank','填空':'fill_blank','fill':'fill_blank','fill_blank':'fill_blank',
    '判断题':'true_false','判断':'true_false','judge':'true_false','true_false':'true_false',
    '解答题':'essay','解答':'essay','essay':'essay' };
  let type = item.type;
  // 教研云 type 简写（single/fill/...）先映射；未识别再按 writtenType 名匹配
  if (typeMap[type]) type = typeMap[type];
  else if (typeMap[writtenType]) type = typeMap[writtenType];
  if (!type) type = 'essay';
  const queId = item.queId || '';
  const code = item.positionCode || item.code || queId || ('SYNC-' + Date.now());
  // 知识点
  const knowledge = (Array.isArray(item.knowledgePoints) && item.knowledgePoints.length)
    ? item.knowledgePoints
    : (Array.isArray(item.knowledge) ? item.knowledge : (item.knowledge ? [item.knowledge] : []));
  // 选项归一化为字符串数组
  let options = [];
  if (Array.isArray(item.options)) {
    options = item.options.map(o => (typeof o === 'string') ? o : (o.label ? (o.label + '. ' + (o.content || '')) : (o.content || '')));
  }
  // 学段→年级映射兜底
  let grade = item.grade || '';
  if (!grade && item.gradeGroupName) {
    const map = { '小学':'一年级','初中':'初一','高中':'高一','大学':'大一' };
    grade = map[item.gradeGroupName] || item.gradeGroupName;
  }
  return {
    id: queId || code,                // 用 queId 作为唯一 id（去重）
    queId: queId,
    code: code,
    subject: item.subject || item.subjectName || '数学',
    grade: grade,
    type: type,
    difficulty: Number(item.difficulty != null ? item.difficulty : 3) || 3,
    score: Number(item.score != null ? item.score : 5) || 5,
    stem: item.stem || '',
    options: options,
    // answer/analysis 可能是 list（教研云返回数组）：归一化为字符串，避免后端 Optional[str] 校验失败(422)
    answer: Array.isArray(item.answer) ? item.answer.filter(x => x != null).join(' ') : (item.answer || ''),
    analysis: Array.isArray(item.analysis) ? item.analysis.filter(x => x != null).join(' ') : (item.analysis || ''),
    knowledge: knowledge,
    category: item.category || ('教研云·' + (item.subjectName || '数学') + '·' + (grade || '')),
    writtenType: writtenType,
    bizType: item.bizType || writtenType,
    source: 'jiaoyanyun',
    status: 'active',
    tags: item.tags || [],
  };
}

// 把教研云题目批量加入 DATA.questions（按 queId/id 去重），返回新增条数
// —— 数据持久化已改为「后端落库」为准（同步/导入都写后端）；本地 localStorage 暂存仅作离线兜底，
//    且只保留后端 int id 题（string id 的教研云题刷新后不再恢复，避免"无有效后端记录"）
function _initialQuestionIds() {
  return new Set((window.REAL_QUESTIONS || []).map(q => q.queId || q.id));
}
function saveLocalQuestions() {
  try {
    const initial = _initialQuestionIds();
    const added = (DATA.questions || []).filter(q => !initial.has(q.queId || q.id));
    localStorage.setItem('added_questions', JSON.stringify(added));
  } catch (e) { /* 容量超限等，静默降级 */ }
}
function restoreLocalQuestions() {
  try {
    const saved = localStorage.getItem('added_questions');
    if (!saved) return;
    const added = JSON.parse(saved);
    if (!Array.isArray(added)) return;
    const existing = new Set((DATA.questions || []).map(q => q.queId || q.id));
    let n = 0;
    added.forEach(q => {
      // 只恢复后端 int id 题（string id 教研云题无后端记录，恢复后也无法删除/使用）
      const k = q.queId || q.id;
      if (!k || !/^\d+$/.test(String(k))) return;
      if (!existing.has(k)) { DATA.questions.push(q); existing.add(k); n++; }
    });
    if (n) console.log('已恢复本地新增题目', n, '道');
    // 顺带清理 localStorage 中的 string id 脏数据（仅保留 int id 题）
    try {

function addQuestionsToBank(items) {
  const list = DATA.questions || (DATA.questions = []);
  const existingIds = new Set(list.map(q => q.queId || q.id));
  const existingCodes = new Set(list.map(q => q.code));
  let added = 0;
  (items || []).forEach(raw => {
    if (!raw) return;
    const q = mapSyncItemToQuestion(raw);
    const key = q.queId || q.id;
    if (!key) return;
    if (existingIds.has(key)) {
      // 去重替换：找到原 index 用新对象覆盖（保留 id 字段）
      const idx = list.findIndex(x => (x.queId || x.id) === key);
      if (idx >= 0) list[idx] = Object.assign({}, list[idx], q);
      return;
    }
    if (existingCodes.has(q.code)) return;  // code 重复也跳过
    list.push(q);
    existingIds.add(key);
    existingCodes.add(q.code);
    added++;
  });
  if (added) saveLocalQuestions();   // 持久化新增题目，防止刷新丢失
  return added;
}

// 统一批量入库：先映射为后端 schema 调 /questions/import 落库；后端不可用时回退内存+localStorage
async function _syncBatchAddToBank(qs) {
  if (!qs.length) { showToast('无有效题目'); return; }
  const items = qs.map(mapSyncItemToQuestion);
  // 1) 尝试后端落库（真实持久化，刷新不丢）
  let okCount = 0, backendOk = false;
  try {
    const subjName = (items[0] && items[0].subject) || '数学';
    const gradeName = (items[0] && items[0].grade) || '初一';
    const subj = (DATA.subjects || []).find(s => s.name === subjName);
    const grade = (DATA.grades || []).find(g => g.name === gradeName);
    const cat = (DATA.questionBankCategories || []).find(c => c.name === subjName);
    const payload = items.map(q => ({
      stem: q.stem || '',
      // 后端枚举校验：再兜底一次教研云 type 简写映射（single/fill/...），避免 422
      ques_type: ({ 'single':'single_choice','multi':'multi_choice','fill':'fill_blank','judge':'true_false','essay':'essay' })[q.type] || q.type || 'essay',
      subject_id: subj ? Number(subj.id) : null,
      grade_id: grade ? Number(grade.id) : null,
      difficulty: parseInt(q.difficulty, 10) || 3,
      options: Array.isArray(q.options) ? q.options : undefined,
      answer: Array.isArray(q.answer) ? q.answer.filter(x => x != null).join(' ') : (q.answer || ''),
      analysis: Array.isArray(q.analysis) ? q.analysis.filter(x => x != null).join(' ') : (q.analysis || ''),
      score: parseInt(q.score, 10) || 5,
      category_id: cat ? Number(cat.id) : null,
      source_id: q.queId || q.code || ('sync-' + Date.now() + '-' + items.indexOf(q)),
    })).filter(x => x.stem && x.stem.trim());
    if (payload.length) {
      const resp = await apiPost('/questions/import', { items: payload });
      if (resp && resp.items) {
        backendOk = true;
        okCount = resp.items.length;
      }
    }
  } catch (e) { /* 后端不可用 → 走本地 */ }
  // 2) 后端成功 → 重新加载题库（后端数据为准）
  if (backendOk) {
    try { await loadBackendData(); STATE.filteredQuestions = null; } catch (e) {}
    showToast('✅ 已入库 ' + okCount + ' 道题目（刷新不丢失）');
    return true;
  } else {
    // 3) 后端不可用 → 不再本地暂存（string id 教研云题无后端记录，会污染题库导致无法删除）
    const err = window._lastApiError;
    const reason = err && err.status ? '（HTTP ' + err.status + (err.message ? '：' + err.message : '') + '）' : '';
    showToast('❌ 导入失败' + reason + '，请检查后端连接后重试', 'error');
    return false;
  }
  // 标记按钮为已添加
  qs.forEach(q => {
    const id = syncResultId(q);
    const b = document.getElementById('addbtn-' + id);
    if (b) { b.textContent = '已添加'; b.disabled = true; }
  });
  // 尽力 POST 到同步代理（不阻塞、失败不提示）
  try {
    fetch(SYNC_API + '/api/bank/add', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questions: qs })
    }).then(() => {}).catch(() => {});
  } catch (e) {}
  syncUpdateCount();
}

function _readQuestionBankFilters() {
  const f = {
    subject: (document.getElementById('filterSubject') || {}).value || '',
    grade: (document.getElementById('filterGrade') || {}).value || '',
    quesType: (document.getElementById('filterType') || {}).value || '',
    difficulty: (document.getElementById('filterDifficulty') || {}).value || '',
    category: (document.getElementById('filterCategory') || {}).value || '',
    keyword: (document.getElementById('searchKeyword') || {}).value || '',
    tags: STATE.tagFilter || [],
  };
  return f;
}
function _applyQuestionBankFilters(f) {
  STATE.filteredQuestions = DATA.questions.filter(q => {
    if (f.subject && q.subject !== f.subject) return false;
    if (f.grade && q.grade !== f.grade) return false;
    if (f.quesType && q.type !== f.quesType) return false;
    if (f.difficulty && String(q.difficulty) !== String(f.difficulty)) return false;
    if (f.category) {
      const cat = q.category || '';
      if (cat !== f.category && !cat.endsWith('·' + f.category) && !cat.endsWith(f.category)) return false;
    }
    if (f.keyword) {
      const hay = stripHtml(q.stem || '') + ' ' + (q.code || '');
      if (hay.toLowerCase().indexOf(f.keyword.toLowerCase()) < 0) return false;
    }
    // 标签筛选：题目需同时包含所有选中标签（AND）
    if (f.tags && f.tags.length) {
      const qt = q.tags || [];
      for (const t of f.tags) { if (qt.indexOf(t) < 0) return false; }
    }
    return true;
  });
  STATE.paging.questionBank = { page: 1, pageSize: (STATE.paging.questionBank && STATE.paging.questionBank.pageSize) || 10 };
}

  if (!tagIds.length) { showToast('请至少选择一个标签', 'error'); return; }
  const numericIds = ids.map(id => /^\d+$/.test(String(id)) ? Number(id) : NaN).filter(n => !isNaN(n));
  if (!numericIds.length) { showToast('所选题目无有效后端记录', 'error'); return; }
  const resp = await apiPost('/questions/batch-tags', { ids: numericIds, tags: tagIds, append: true });
  if (!resp) {
    const err = window._lastApiError;
    showToast(err && err.status ? '设置失败（HTTP ' + err.status + '）：' + (err.message || '') : '设置失败：后端未连接或接口异常', 'error');
    return;
  }
  // 同步本地内存（追加，去重）
  let n = 0;
  ids.forEach(id => {
    const q = DATA.questions.find(x => String(x.id) === String(id));
    if (q) {
      if (!Array.isArray(q.tags)) q.tags = [];
      tagIds.forEach(t => { if (q.tags.indexOf(t) < 0) q.tags.push(t); });
      n++;
    }
  });
  closeModal();
  showToast('已为 ' + (resp.updated != null ? resp.updated : n) + ' 题添加标签');
  _applyQuestionBankFilters(_readQuestionBankFilters());
  const el = document.getElementById('questionBankBody');
  if (el) el.innerHTML = _renderQuestionBankBody();
  const sa = document.getElementById('selectAll');
  if (sa) sa.checked = false;
}
function batchDelete() {
  const ids = _getSelectedQuestionIds();
  if (ids.length === 0) { showToast('请先选择题目'); return; }
  openModal('确认删除', `<p style="color:var(--error);">⚠️ 确定要删除选中的 ${ids.length} 道题目吗？此操作不可撤销。</p>`,
    `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="confirmBatchDelete(${JSON.stringify(ids).replace(/"/g,'&quot;')})">确认删除</button>`);
}
async function confirmBatchDelete(ids) {
  // 只传后端 int id；教研云同步题的 string id（queId hex）转成后端落库后的 int id
  const numericIds = ids.map(id => {
    if (/^\d+$/.test(String(id))) return Number(id);
    const q = DATA.questions.find(x => String(x.id) === String(id));
    if (q && /^\d+$/.test(String(q.backendId || q.id))) return Number(q.backendId || q.id);
    // 尝试按 source_id 匹配后端题
    const bk = (DATA.questions || []).find(x => String(x.sourceId || x.queId || '') === String(id));
    if (bk && /^\d+$/.test(String(bk.id))) return Number(bk.id);
    return NaN;
  }).filter(n => !isNaN(n));
  if (!numericIds.length) { showToast('所选题目无有效后端记录，无法删除', 'error'); closeModal(); return; }
  const resp = await apiPost('/questions/batch-delete', { ids: numericIds });
  if (!resp) {
    const err = window._lastApiError;
    const msg = err && err.status === 403 ? '无删除权限（请联系管理员在用户管理中授权）' :
                (err && err.status ? '删除失败（HTTP ' + err.status + '）：' + (err.message || '') : '删除失败：后端未连接或接口异常');
    showToast(msg, 'error');
    return;
  }
  const idSet = new Set(ids.map(String));
  DATA.questions = DATA.questions.filter(q => !idSet.has(String(q.id)));
  closeModal();
  showToast('已删除 ' + (resp.deleted != null ? resp.deleted : numericIds.length) + ' 题');
  _applyQuestionBankFilters(_readQuestionBankFilters());
  const el = document.getElementById('questionBankBody');
  if (el) el.innerHTML = _renderQuestionBankBody();
  const sa = document.getElementById('selectAll');
  if (sa) sa.checked = false;
}

async function confirmEditQuestion(qid) {
  const q = DATA.questions.find(x => String(x.id) === String(qid));
  if (!q) return;
  q.type = (document.getElementById('eqType') || {}).value || q.type;
  q.difficulty = parseInt((document.getElementById('eqDifficulty') || {}).value, 10) || q.difficulty;
  q.subject = (document.getElementById('eqSubject') || {}).value || q.subject;
  q.grade = (document.getElementById('eqGrade') || {}).value || q.grade;
  q.category = (document.getElementById('eqCategory') || {}).value || '';
  q.score = parseInt((document.getElementById('eqScore') || {}).value, 10) || 0;
  q.tags = Array.from(document.querySelectorAll('.edit-tag-checkbox:checked')).map(cb => cb.value);
  // 名称 → id 映射（后端存外键 id）
  const body = {
    ques_type: q.type,
    difficulty: q.difficulty,
    subject_id: _qNameToId(DATA.subjects, q.subject),
    grade_id: _qNameToId(DATA.grades, q.grade),
    category_id: _qNameToId(DATA.questionBankCategories, q.category),
    score: q.score,
    tags: q.tags || [],
    answer: q.answer != null ? q.answer : null,
    analysis: q.analysis != null ? q.analysis : null,
    options: Array.isArray(q.options) ? q.options : [],
    stem: q.stem || '',
  };
  const resp = await apiPut('/questions/' + String(q.id), body);
  if (!resp) { showToast('保存失败：后端未连接或接口异常', 'error'); return; }
  closeModal();
  showToast('题目已更新');
  _applyQuestionBankFilters(_readQuestionBankFilters());
  const el = document.getElementById('questionBankBody');
  if (el) el.innerHTML = _renderQuestionBankBody();
}

// 名称 → 后端 id（找不到返回 null = 清除/无）

  if (!name || !Array.isArray(list)) return null;
  const it = list.find(x => x.name === name);
  return it && it.id != null ? Number(it.id) : null;
}

// HTML 转义 / JS 字符串安全（用于展示文件名与内嵌 onclick）
function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function safeJsStr(s) {
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 后端返回的格式 key → 中文名/图标
const SMART_FORMATS = {
  docx: { name: 'Word 文档', icon: '📄' },
  pdf:  { name: 'PDF 文档', icon: '📕' },
  png:  { name: '图片', icon: '🖼️' },
  jpg:  { name: '图片', icon: '🖼️' },
  xlsx: { name: 'Excel 表格', icon: '📊' },
  text: { name: '文本', icon: '📃' },
};

// 多文件：清空 input 允许重复选同一文件，逐个串行导入（避免视觉模型并发超限）
async function smartHandleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;

  }

// 处理单个文件：上传 → 自动检测 → 解析 → 提供预览入口
async function smartProcessOne(file) {
  const queue = document.getElementById('smartImportQueue');
  if (!queue) return;
  const item = document.createElement('div');
  item.className = 'smart-import-item';
  item.dataset.fname = file.name;
  item.innerHTML = `
    <div class="line1"><span class="fname">📄 ${escHtml(file.name)}</span><span class="status">⏳ 识别中…</span></div>
    <div class="detail" style="font-size:12px;color:var(--text-sub);"></div>`;
  queue.insertBefore(item, queue.firstChild);

  const setStatus = (text, cls) => {
    const s = item.querySelector('.status');
    if (s) { s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : ''); }
  };
  const setDetail = (html) => {
    const d = item.querySelector('.detail');
    if (d) d.innerHTML = html;
  };

  // 1. 扩展名预判（仅提示，最终以后端 magic bytes 识别为准）
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const guessFmt = SMART_FORMATS[ext];
  if (guessFmt) {
    setStatus(guessFmt.icon + ' 识别到 ' + guessFmt.name + '，解析中…');
  } else {
    setStatus('🔎 正在自动识别文件类型…');
  }

  // 2. 携带 AI 模型配置上传（图片/PDF 需要；本地解析格式会被忽略）
  const cfg = (typeof _loadAiModelConfig === 'function') ? _loadAiModelConfig() : null;
  const preset = (window.AI_MODEL_PRESETS || []).find(p => p.provider === (cfg && cfg.provider));
  const fd = new FormData();
  fd.append('file', file);
  fd.append('difficulty', '3');
  fd.append('provider', (cfg && cfg.provider) || 'zhipu');
  fd.append('api_key', (cfg && cfg.apiKey) || '');
  fd.append('model', (cfg && cfg.modelType) || 'glm-4v');
  fd.append('base_url', (preset && preset.baseUrl) || '');

  try {
    const resp = await fetch(window.API_BASE + '/questions/import-smart', { method: 'POST', headers: _authHeaders(), body: fd });
    let d = null;
    try { d = await resp.json(); } catch (e) {}
    if (!d || d.code !== 0) {
      const raw = (d && (d.message || (Array.isArray(d.detail) ? '参数错误' : d.detail))) || ('解析失败（HTTP ' + resp.status + '）');
      const warn = (d && d.data && d.data.warnings) || [];
      setStatus('❌ 解析失败', 'err');
      let html = `<div style="color:var(--error);">${escHtml(raw)}</div>`;
      if (warn.length) html += warn.map(w => `<div style="color:#d46b08;">⚠️ ${escHtml(w)}</div>`).join('');
      setDetail(html);
      return;
    }
    const info = d.data || {};
    const fmt = info.format || 'text';
    const fmtInfo = SMART_FORMATS[fmt] || { name: fmt, icon: '📄' };
    const n = info.count || 0;
    const imgN = info.img_questions || 0;
    window._smartImportResults = window._smartImportResults || {};
    window._smartImportResults[file.name] = { questions: info.questions || [], info: info };
    if (n > 0) {
      setStatus('✅ 识别 ' + n + ' 题（格式：' + fmtInfo.name + '）', 'ok');
      let detail = '学科：<b>' + escHtml(info.detected_subject || '未识别') + '</b> · 年级：<b>' + escHtml(info.detected_grade || '未识别') + '</b>';
      if (imgN) detail += ' · 🖼️ ' + imgN + ' 题含图';
      const warn = (info.warnings || []).filter(Boolean);
      if (warn.length) detail += ' · <span style="color:#d46b08;">' + warn.map(escHtml).join('；') + '</span>';
      detail += ` &nbsp;<button class="btn btn-sm btn-primary" onclick="smartOpenPreview('${safeJsStr(file.name)}')">预览并确认导入</button>`;
      setDetail(detail);
    } else {

      setDetail(`<div style="color:var(--error);">${escHtml(d.message || '未能识别出任何题目，请检查文件内容')}</div>`);
    }
  } catch (e) {
    setStatus('❌ 导入失败', 'err');
    setDetail('<div style="color:var(--error);">网络异常或接口不可用，请确认后端服务已启动后重试</div>');
  }
}
