// 从文件名推断学科/年级（保留：兼容其它调用；智能导入已由后端推断）
function guessImportMeta(filename) {
  const name = filename || '';
  let subject = '', grade = '';
  const subjMap = { '数学':'数学', '语文':'语文', '英语':'英语', '物理':'物理', '化学':'化学', '生物':'生物' };
  for (const kw in subjMap) { if (name.indexOf(kw) >= 0) { subject = subjMap[kw]; break; } }
  const gradeKw = [
    ['一年级','一年级'],['二年级','二年级'],['三年级','三年级'],['四年级','四年级'],['五年级','五年级'],['六年级','六年级'],
    ['七年级','初一'],['初一','初一'],['八年级','初二'],['初二','初二'],['九年级','初三'],['初三','初三'],
    ['高一','高一'],['高二','高二'],['高三','高三'],
  ];
  for (const [kw, g] of gradeKw) { if (name.indexOf(kw) >= 0) { grade = g; break; } }
  return { subject, grade };
}

// 生成 4 位导入源编码（每位 A-Z 0-9 随机）
function genSourceCode() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s = '';
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

// 统一把题目列表落库（智能导入共用）：映射名称→id 后 POST /questions/import，成功后刷新题库
// source: docx/pdf/png/jpg/xlsx/text；overrides: {subject, grade, fileName}（用户预览确认时可改学科/年级）
async function _importQuestionsToBackend(qs, source, overrides) {
  const ov = overrides || {};
  const sourceCode = genSourceCode();
  // 学科/年级：用户预览确认值 > 解析结果 > 前端兜底
  const subjectName = ov.subject || (qs[0] && qs[0].subject) || '数学';
  const gradeName = ov.grade || (qs[0] && qs[0].grade) || '';
  const items = qs.map(q => ({
    stem: q.stem || '',
    ques_type: q.type || 'essay',
    subject_id: null,
    grade_id: null,
    subject_name: ov.subject ? subjectName : ((q.subject || subjectName) || null),  // 用户改过则统一覆盖
    grade_name: ov.grade ? gradeName : ((q.grade || gradeName) || null),
    difficulty: q.difficulty || 3,
    options: Array.isArray(q.options) ? q.options : undefined,
    answer: q.answer || '',
    analysis: q.analysis || '',
    score: q.score || 5,
    category_id: null,
    source_id: q.code || (q.queId) || (sourceCode + '-' + (qs.indexOf(q) + 1)),
  })).filter(x => x.stem && x.stem.trim());
  if (!items.length) { showToast('无有效题目可导入', 'error'); return; }
  const resp = await apiPost('/questions/import', { items });
  if (!resp) {
    const lastErr = window._lastApiError;
    const msg = (lastErr && lastErr.message) ? lastErr.message : '导入失败：接口异常，请稍后重试';
    showToast('❌ ' + msg, 'error');
    return;
  }
  const ok = (resp.items || []).length;
  showToast('✅ 成功导入 ' + ok + ' 题到题库');
  const fmtInfo = SMART_FORMATS[source] || { name: 'Word', icon: '📄' };
  const fmtName = fmtInfo.name;
  const logRec = {
    fileName: ov.fileName || (fmtName + '·' + subjectName + '·' + gradeName),
    format: fmtName,
    totalQuestions: items.length, successCount: ok, failCount: Math.max(0, items.length - ok),
    status: 'completed', createdAt: new Date().toLocaleString('zh-CN'),
    questionCodes: (resp.items || []).map(q => ({ id: q.id, code: q.question_code || '' })),
    sourceCode: sourceCode,
  };
  try {
    await apiPost('/import-logs', {
      file_name: logRec.fileName, format: fmtName,
      total_questions: items.length, success_count: ok, fail_count: logRec.failCount, status: 'completed'
    });
  } catch (e) { /* 后端记录失败不阻塞 */ }
  DATA.importLogs.unshift({ id: 'il' + Date.now(), ...logRec });
  // 刷新题库数据与页面
  if (window.loadBackendData) { await loadBackendData(); STATE.filteredQuestions = null; }
  const el = document.getElementById('importLogsBody');
  if (el) el.innerHTML = _renderImportLogsBody();
  // 更新导入队列中该文件的状态
  if (ov.fileName) {
    document.querySelectorAll('.smart-import-item').forEach(it => {
      if (it.dataset.fname === ov.fileName) {
        const s = it.querySelector('.status');
        if (s) { s.textContent = '✅ 已导入 ' + ok + ' 题'; s.className = 'status ok'; }
        const d = it.querySelector('.detail');
        if (d) d.innerHTML = '已写入题库，可在题库管理中查看';
      }
    });
  }
}

const TAG_COLORS = [
  { v:'red', name:'红色' },
  { v:'blue', name:'蓝色' },
  { v:'orange', name:'橙色' },
  { v:'green', name:'绿色' },
];
function tagColorName(v) { const c = TAG_COLORS.find(x => x.v === v); return c ? c.name : '蓝色'; }
function _tagCount(tagId) { return DATA.questions.filter(q => (q.tags || []).indexOf(String(tagId)) >= 0).length; }

function renderTagPage() {
  return `
    <div class="page-header">
      <h2>标签管理</h2>

}

function _renderTagBody() {
  const pg = _pg('tags');

                <td>${tagColorName(t.color)}</td>
                <td>${_tagCount(t.id)}</td>

                  <button class="btn btn-sm btn-text" onclick="showEditTagModal('${t.id}')">编辑</button>
                  <button class="btn btn-sm btn-text" style="color:var(--error);" onclick="deleteTag('${t.id}')">删除</button>

function tagPageChange(newPage, newPageSize) {

function _tagColorOptions(selected) {
  return TAG_COLORS.map(c => `<option value="${c.v}" ${c.v === selected ? 'selected' : ''}>${c.name}</option>`).join('');
}

function showAddTagModal() {
  openModal('新建标签', `
    <div class="form-row"><label>标签名</label><div class="form-input"><input type="text" id="tagNameInput" class="form-input" placeholder="请输入标签名"></div></div>
    <div class="form-row"><label>颜色</label><div class="form-input"><select id="tagColorInput" class="form-input">${_tagColorOptions('blue')}</select></div></div>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="confirmAddTag()">保存</button>`);
}
async function confirmAddTag() {
  const name = (document.getElementById('tagNameInput') || {}).value || '';
  const color = (document.getElementById('tagColorInput') || {}).value || 'blue';
  if (!name.trim()) { showToast('标签名不能为空', 'error'); return; }
  if (DATA.tags.some(t => t.name === name.trim())) { showToast('标签名已存在', 'error'); return; }
  const resp = await apiPost('/tags', { name: name.trim(), color });
  if (!resp) { showToast('创建失败：后端未连接或接口异常', 'error'); return; }
  DATA.tags.push({ id: String(resp.id), name: resp.name, color: resp.color || color });
  closeModal();
  showToast('标签已创建');
  const el = document.getElementById('tagBody');
  if (el) el.innerHTML = _renderTagBody();
}
function showEditTagModal(id) {
  const t = DATA.tags.find(x => x.id === id);
  if (!t) return;
  openModal('编辑标签', `
    <div class="form-row"><label>标签名</label><div class="form-input"><input type="text" id="tagNameInput" class="form-input" value="${t.name}"></div></div>
    <div class="form-row"><label>颜色</label><div class="form-input"><select id="tagColorInput" class="form-input">${_tagColorOptions(t.color)}</select></div></div>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="confirmEditTag('${id}')">保存</button>`);
}
async function confirmEditTag(id) {
  const t = DATA.tags.find(x => String(x.id) === String(id));
  if (!t) return;
  const name = (document.getElementById('tagNameInput') || {}).value || '';
  const color = (document.getElementById('tagColorInput') || {}).value || 'blue';
  if (!name.trim()) { showToast('标签名不能为空', 'error'); return; }
  const dup = DATA.tags.some(x => String(x.id) !== String(id) && x.name === name.trim());
  if (dup) { showToast('标签名已存在', 'error'); return; }
  const resp = await apiPut('/tags/' + String(id), { name: name.trim(), color });
  if (!resp) { showToast('保存失败：后端未连接或接口异常', 'error'); return; }
  t.name = resp.name || name.trim();
  t.color = resp.color || color;
  closeModal();
  showToast('标签已更新');
  const el = document.getElementById('tagBody');
  if (el) el.innerHTML = _renderTagBody();
}
function deleteTag(id) {
  const t = DATA.tags.find(x => x.id === id);
  if (!t) return;
  const cnt = _tagCount(id);
  openModal('删除标签', `<p>确定删除标签「<b>${t.name}</b>」吗？${cnt > 0 ? '将同时移除 ' + cnt + ' 道题目上的该标签。' : ''}</p>`,
    `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="confirmDeleteTag('${id}')">确认删除</button>`);
}
async function confirmDeleteTag(id) {
  const resp = await apiDelete('/tags/' + String(id));
  if (!resp) { showToast('删除失败：后端未连接或接口异常', 'error'); return; }
  DATA.tags = DATA.tags.filter(t => String(t.id) !== String(id));
  DATA.questions.forEach(q => { if (q.tags) q.tags = q.tags.filter(x => String(x) !== String(id)); });
  closeModal();
  showToast('标签已删除');
  const el = document.getElementById('tagBody');
  if (el) el.innerHTML = _renderTagBody();
}

  const key = { questionBank:'questionBankCategories', paper:'paperCategories', task:'taskCategories' }[type];
  const ctype = { questionBank:'question', paper:'paper', task:'task' }[type];
  const resp = await apiGet('/categories?type=' + ctype + '&page_size=200');

function paperTaskUsed(paperId) {
  return (DATA.tasks || []).some(t => t.paperId === paperId || String(t.paperId) === String(paperId));
}
async function deletePaper(id) {
  const p = DATA.papers.find(x => String(x.id) === String(id));
  if (!p) return;
  const taskCount = (DATA.tasks || []).filter(t => String(t.paperId) === String(id)).length;
  const warn = taskCount > 0
    ? `该试卷已被 ${taskCount} 个考试任务引用。\n删除后将同时删除：\n· 试卷本身\n· 引用的 ${taskCount} 个考试任务\n· 这些任务的学生答题卡与逐题评分\n删除后不可恢复！`
    : '确定删除试卷「' + (p.name || p.code) + '」吗？删除后不可恢复。';
  if (!confirm(warn)) return;
  const resp = await apiDelete('/papers/' + encodeURIComponent(id));
  if (!resp) { showToast('删除失败，请检查后端连接', 'error'); return; }
  showToast('试卷已删除（含关联任务/答题卡/评分）');
  if (window.loadBackendData) { await loadBackendData(); STATE.filteredPapers = null; }
  navigate('paper');
}

function _readPaperFilters() {
  return {
    category: (document.getElementById('paperFilterCategory') || {}).value || '',

    keyword: (document.getElementById('paperFilterKeyword') || {}).value || '',
  };
}
function _applyPaperFilters(f) {
  STATE.filteredPapers = DATA.papers.filter(p => {
    if (f.category && p.category !== f.category) return false;
    if (f.subject && p.subject !== f.subject) return false;
    if (f.grade && p.grade !== f.grade) return false;
    if (f.keyword) {
      const hay = (p.name || '') + ' ' + (p.code || '');
      if (hay.toLowerCase().indexOf(f.keyword.toLowerCase()) < 0) return false;
    }
    return true;
  });
  STATE.paging.paperList = { page: 1, pageSize: (STATE.paging.paperList && STATE.paging.paperList.pageSize) || 10 };
}

function toggleQuestion(qid, checked) {
  const qidStr = String(qid);
  if (checked) {
    if (!STATE.selectedQuestions.some(id => String(id) === qidStr)) STATE.selectedQuestions.push(qid);
  } else {
    STATE.selectedQuestions = STATE.selectedQuestions.filter(id => String(id) !== qidStr);
  }
  savePaperDraft();        // 后台保存草稿（按用户隔离）
  rerenderPaperCreate();   // 实时刷新左侧题目列表勾选状态
  updatePaperCart();       // 实时刷新购物车（题量+总分）
}
// 后台保存/恢复组卷草稿（按用户隔离，多用户互不干扰）
function savePaperDraft() {
  const ids = STATE.selectedQuestions || [];
  fetch(window.API_BASE + '/paper-drafts', {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, _authHeaders()),
    body: JSON.stringify({ questions: ids })
  }).catch(() => {});
}
function restorePaperDraft() {
  fetch(window.API_BASE + '/paper-drafts', { headers: _authHeaders() })
    .then(r => r.json()).then(d => {
      if (d.code === 0 && d.data && Array.isArray(d.data.questions) && d.data.questions.length > 0) {
        STATE.selectedQuestions = d.data.questions;
        rerenderPaperCreate();
      }
    }).catch(() => {});
}
// 创建试卷-选题步骤：根据 STATE.paperCreateFilters 过滤题目并渲染表格
function _renderPaperCreateQListBody() {

    if (F.subject && q.subject !== F.subject) return false;

    if (F.quesType && q.type !== F.quesType) return false;
    if (F.difficulty && String(q.difficulty) !== String(F.difficulty)) return false;
    if (F.knowledge && !((q.knowledge || []).indexOf(F.knowledge) >= 0)) return false;
    if (F.category) {
      const cat = q.category || '';
      if (cat !== F.category && !cat.endsWith('·' + F.category) && !cat.endsWith(F.category)) return false;
    }
    if (F.keyword) {
      const hay = stripHtml(q.stem) + ' ' + (q.code || '');
      if (hay.indexOf(F.keyword) < 0) return false;
    }
    return true;
  });
  const pg = _pg('paperCreate');
  const total = filtered.length;
  const start = (pg.page - 1) * pg.pageSize;
  const slice = filtered.slice(start, start + pg.pageSize);
  return `
    <div class="table-wrap" style="max-height:400px;overflow-y:auto;">
      <table class="data-table">

async function goPaperCreateStep(step) {
  // Transitioning to step 3 = actually CREATE the paper from selected questions（落表）
  if (step === 3) {
    const selectedIds = STATE.selectedQuestions || [];
    if (selectedIds.length === 0) { showToast('请先选择题目', 'error'); return; }
    const selectedQuestions = selectedIds.map(id => DATA.questions.find(q => String(q.id) === String(id))).filter(Boolean);
    const nameInput = document.getElementById('pcName');
    const catInput = document.getElementById('pcCategory');
    const subjInput = document.getElementById('pcSubject');
    const gradeInput = document.getElementById('pcGrade');
    const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : '未命名试卷';
    const categoryName = catInput ? catInput.value : ((DATA.paperCategories[0] && DATA.paperCategories[0].name) || '');
    const subjectName = subjInput ? subjInput.value : '数学';
    const gradeName = gradeInput ? gradeInput.value : '初一';

    // 名称 → 后端分类 int id
    const subj = (DATA.subjects || []).find(s => s.name === subjectName);
    const grade = (DATA.grades || []).find(g => g.name === gradeName);
    const cat = (DATA.paperCategories || []).find(c => c.name === categoryName);
    // 只收系统题库 int id；教研云本地字符串 id 题未入库，明确提示而非静默丢弃
    const questionIds = [];
    const skippedStr = [];
    selectedIds.forEach(id => {
      const n = parseInt(id, 10);
      if (!isNaN(n)) questionIds.push(n); else skippedStr.push(id);
    });
    if (!questionIds.length) { showToast('所选题目均未同步到系统题库，无法组卷：请先在「同步教研云」或「导入」中把题目加入题库', 'error'); return; }
    if (skippedStr.length) showToast('提示：' + skippedStr.length + ' 道题未入库（教研云本地题），已自动跳过', 'warning');

    // 真正调后端落表（拿到 int id，删除/详情才能正常）
    let created = null;
    if (getApiToken()) {
      try {
        created = await apiPost('/papers', {
          name: name,
          subject_id: subj ? Number(subj.id) : null,
          grade_id: grade ? Number(grade.id) : null,
          category_id: (cat && cat.id != null) ? (parseInt(cat.id, 10) || null) : null,
          question_ids: questionIds,
        });
      } catch (e) { created = null; }
    }

    if (created && created.id != null) {
      // 用后端返回的真实数据（int id）落前端，确保删除/详情可用
      const paper = mapBackendToDemoShape(created, 'paper');
      DATA.papers.push(paper);
      STATE.lastCreatedPaperId = String(created.id);
      STATE.lastCreatedPaperCode = paper.code || '';
      showToast('试卷「' + name + '」创建成功');
    } else {
      // 后端未连接：回退内存创建（仅本地，刷新即失，且无法删除）
      const totalScore = selectedQuestions.reduce((sum, q) => sum + (Number(q.score) || 0), 0);
      const newId = 'p' + Date.now();
      const today = new Date();
      const ymd = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
      const seq = String(DATA.papers.length + 1).padStart(3, '0');
      const code = 'P' + ymd.replace(/-/g,'') + '-' + seq;
      DATA.papers.push({
        id: newId, code: code, name: name, category: categoryName, subject: subjectName, grade: gradeName,
        totalScore: totalScore, questionCount: selectedQuestions.length, status: 'active',
        createdAt: ymd, questions: selectedQuestions.map(q => q.id)
      });
      STATE.lastCreatedPaperId = newId;
      STATE.lastCreatedPaperCode = code;
      showToast('试卷「' + name + '」创建成功（后端未连接，仅本地保存）', 'warning');
    }
  }
  STATE.paperCreateStep = step;
  rerenderPaperCreate();
}
function moveQuestion(index, dir) {
  const arr = STATE.selectedQuestions;
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= arr.length) return;
  [arr[index], arr[newIndex]] = [arr[newIndex], arr[index]];
  rerenderPaperCreate();
}

// 按考试排版顺序排序题目：选择(单选/多选/判断) → 填空 → 解答
const QUESTION_TYPE_SORT = { single_choice:0, multi_choice:0, true_false:0, fill_blank:1, essay:2 };
function sortQuestionsByExamType(questions) {
  return [...questions].sort((a, b) => {
    const ta = QUESTION_TYPE_SORT[a.type] != null ? QUESTION_TYPE_SORT[a.type] : 9;
    const tb = QUESTION_TYPE_SORT[b.type] != null ? QUESTION_TYPE_SORT[b.type] : 9;
    return ta - tb;
  });
}

// 生成二维码 dataURL（机器识别标记：承载任务-试卷-学生三元组）
function _generateQRDataUrl(payload) {
  try {
    const qr = qrcode(0, 'M');
    qr.addData(payload);
    qr.make();
    return qr.createDataURL(4, 4);
  } catch (e) { return ''; }
}

function renderAnswerSheetPreviewHtml(paper, task, student) {
  const questions = paper.questions.map(qid => DATA.questions.find(q => String(q.id) === String(qid))).filter(Boolean);
  const ordered = sortQuestionsByExamType(questions);
  const subject = paper.subject || (questions[0] && questions[0].subject) || '数学';
  // 二维码载荷（任务-试卷-学生三元组 + 张次）
  const qrPayload = `JY|tk=${task ? (task.code || '') : ''}|pp=${paper.code || ''}|st=${student ? (student.code || '') : ''}|sb=${subject}|pg=1/1`;
  const qrDataUrl = _generateQRDataUrl(qrPayload);
  let html = '<div class="answer-sheet-preview">';
  // 四角对位标记（┌ ┐ └ ┘，拍照后透视校正）
  html += '<span class="reg-mark rm-tl"></span><span class="reg-mark rm-tr"></span><span class="reg-mark rm-bl"></span><span class="reg-mark rm-br"></span>';
  // 机读带：任务/试卷/学生信息 + 二维码
  html += '<div class="answer-sheet-header">';
  html += '<div class="ah-info">';
  if (task) html += `<span><b>任务：</b>${task.code || ''} ${task.name || ''}</span>`;
  html += `<span><b>试卷：</b>${paper.code || paper.name || ''}</span>`;
  if (student) html += `<span><b>学生：</b>${student.code || ''} ${student.name || ''}（${student.className || ''}）</span>`;
  html += '</div>';
  html += `<div class="ah-qr">${qrDataUrl ? `<img src="${qrDataUrl}" alt="QR">` : '<div class="qr-placeholder">QR</div>'}<div class="qr-caption">扫码识别</div></div>`;
  html += '</div>';
  // 按 选择 → 填空 → 解答 分组并重新连续编号
  const groups = [
    { types: ['single_choice','multi_choice','true_false'], label: '一、选择题（涂点区）' },
    { types: ['fill_blank'], label: '二、填空题（填空框）' },
    { types: ['essay'], label: '三、解答题（方格稿纸）' },
  ];
  let seq = 0;
  const sections = groups.map(g => {
    const items = [];
    ordered.forEach(q => {
      if (g.types.indexOf(q.type) >= 0) {
        seq += 1;
        items.push({ q, no: seq });
      }
    });
    return { label: g.label, items };
  }).filter(s => s.items.length > 0);
  sections.forEach(sec => {
    html += `<div class="answer-sheet-section"><h4>${sec.label}（共${sec.items.length}题）</h4>`;
    sec.items.forEach(({ q, no }) => {
      if (q.type === 'single_choice' || q.type === 'multi_choice') {
        const opts = q.options || [];
        const letters = opts.map(o => String(safeStr(o)).charAt(0));
        // 单选圆涂点、多选方涂点
        const cls = q.type === 'multi_choice' ? 'bubble square' : 'bubble';
        html += `<div class="answer-sheet-choice"><span class="qno">${no}.</span>`;
        letters.forEach(l => { html += `<span class="${cls}">${l}</span>`; });
        html += `</div>`;
      } else if (q.type === 'true_false') {
        html += `<div class="answer-sheet-choice"><span class="qno">${no}.</span><span class="bubble">√</span><span class="bubble">×</span></div>`;
      } else if (q.type === 'fill_blank') {
        html += `<div class="blank-row"><span class="qno">${no}.</span><span class="blank">　</span><span class="blank">　</span></div>`;
      } else if (q.type === 'essay') {
        const height = Math.max(60, q.score * 8);
        html += `<div style="margin-bottom:8px;"><span class="qno">${no}.</span><div class="grid-paper" style="min-height:${height}px;"></div></div>`;
      }
    });
    html += `</div>`;
  });
  html += '</div>';
  return html;
}

async function paperVoid(id) {

/* ---- 下载试卷（Word .doc 兼容 HTML）---- */
function downloadPaperWord(paperId) {
  const paper = DATA.papers.find(p => p.id === paperId) || DATA.papers[0];
  if (!paper) { showToast('未找到试卷'); return; }
  const questions = sortQuestionsByExamType((paper.questions || []).map(qid => DATA.questions.find(q => String(q.id) === String(qid))).filter(Boolean));
  const typeFullName = (code) => DATA.questionTypes.find(t => t.code === code)?.name || code;
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const rows = questions.map((q, i) => {
    const opts = (q.options && q.options.length)
      ? `<br><div style="margin-left:16px;">${q.options.map(o => `<div>${esc(safeStr(o))}</div>`).join('')}</div>`
      : '';
    return `
      <tr>
        <td style="border:1px solid #999;padding:6px;vertical-align:top;text-align:center;">${i + 1}</td>
        <td style="border:1px solid #999;padding:6px;vertical-align:top;text-align:center;">${typeFullName(q.type)}</td>
        <td style="border:1px solid #999;padding:6px;vertical-align:top;">${q.stem || ''}${opts}</td>
        <td style="border:1px solid #999;padding:6px;vertical-align:top;">${q.answer || ''}</td>
        <td style="border:1px solid #999;padding:6px;vertical-align:top;text-align:center;">${q.score || 0}</td>
      </tr>`;
  }).join('');
  const totalScore = questions.reduce((s, q) => s + (Number(q.score) || 0), 0);
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"><title>${esc(paper.name)}</title>
<style>body{font-family:'宋体',SimSun,serif;font-size:12pt;line-height:1.8;}h1{text-align:center;font-size:18pt;margin-bottom:8pt;}table{border-collapse:collapse;width:100%;}th{background:#f0f0f0;}</style>
</head><body>
<h1>${esc(paper.name)}</h1>
<div style="margin-bottom:12pt;">
  <span>试卷编号：${esc(paper.code || '')}</span>　
  <span>学科：${esc(paper.subject || '')}</span>　
  <span>年级：${esc(paper.grade || '')}</span>　
  <span>分类：${esc(paper.category || '')}</span>　
  <span>题数：${questions.length}</span>　
  <span>总分：${totalScore}</span>
</div>
<table>
  <thead><tr>
    <th style="border:1px solid #999;padding:6px;width:50px;">题号</th>
    <th style="border:1px solid #999;padding:6px;width:80px;">题型</th>
    <th style="border:1px solid #999;padding:6px;">题干 / 选项</th>
    <th style="border:1px solid #999;padding:6px;width:200px;">标准答案</th>
    <th style="border:1px solid #999;padding:6px;width:50px;">分值</th>
  </tr></thead>
  <tbody>${rows}</tbody>
</table>
</body></html>`;
  const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (paper.name || 'paper') + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('已下载试卷：' + (paper.name || '') + '.doc');
}

/* ================================================================
   A. 模板工具函数（试卷模板 / 答题卡模板：下载 blob / 上传 multipart / 打印窗口）
   ================================================================ */
function _apiBase() { return window.API_BASE || '/api/v1'; }

// 下载文件流（后端返回 blob + Content-Disposition: attachment; filename*=UTF-8''xxx）
// fallbackName 用于后端未给文件名时的兜底
async function downloadBlob(url, fallbackName) {
  try {
    const res = await fetch(url, { headers: _authHeaders() });
    if (!res.ok) {
      let msg = '下载失败（HTTP ' + res.status + '）';
      try { const d = await res.json(); msg = (d && (d.detail || d.message)) || msg; } catch (e) {}
      showToast('❌ ' + msg, 'error');
      return false;
    }
    const blob = await res.blob();
    let filename = fallbackName || 'download';
    const cd = res.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename\*=UTF-8''([^;]+)/i);
    if (m) { try { filename = decodeURIComponent(m[1]); } catch (e) {} }
    else { const m2 = cd.match(/filename="?([^";]+)"?/i); if (m2) filename = m2[1]; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return true;
  } catch (e) {
    showToast('❌ 下载失败：' + (e.message || '网络错误'), 'error');
    return false;
  }
}

// 上传模板覆盖（multipart/form-data），成功返回后端 json，失败 toast 透传后端 message
async function uploadTemplate(url, file) {
  if (!file) return null;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext !== 'docx' && ext !== 'doc') { showToast('❌ 仅支持 .docx/.doc 文件', 'error'); return null; }
  if (file.size > 10 * 1024 * 1024) { showToast('❌ 文件超过 10MB 限制', 'error'); return null; }
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch(url, { method: 'POST', headers: _authHeaders(), body: fd });
    let d = null;
    try { d = await res.json(); } catch (e) {}
    if (!res.ok) {
      let msg = '上传失败（HTTP ' + res.status + '）';
      if (d) {
        if (typeof d.detail === 'string') msg = d.detail;
        else if (Array.isArray(d.detail) && d.detail.length) {
          const e0 = d.detail[0]; msg = (e0 && (e0.msg || e0.message)) || msg;
        }
        else if (d.message) msg = d.message;
      }
      showToast('❌ ' + msg, 'error');
      return null;
    }
    return d;
  } catch (e) {
    showToast('❌ 上传失败：' + (e.message || '网络错误'), 'error');
    return null;
  }
}

// 新窗口展示后端返回的 HTML 并自动打印（后端 HTML 已含 <html><body> 与打印触发）
function openPrintWindow(title, html) {
  const w = window.open('', '_blank');
  if (!w) { showToast('⚠️ 请允许弹出窗口以预览/打印' + title, 'warning'); return null; }
  w.document.open();
  w.document.write(html);
  w.document.close();
  showToast('📄 已打开' + title + '，请在打印对话框选择目标（另存为 PDF / 打印机）');
  return w;
}

// 拉取后端打印 HTML（GET 返回纯 HTML）→ 新窗口展示打印
async function openRemotePrint(url, title) {
  try {
    const res = await fetch(url, { headers: _authHeaders() });
    if (!res.ok) {
      let msg = '加载失败（HTTP ' + res.status + '）';
      try { const d = await res.json(); msg = (d && (d.detail || d.message)) || msg; } catch (e) {}
      showToast('❌ ' + msg, 'error');
      return;
    }
    const html = await res.text();
    if (!html || !html.trim()) { showToast('❌ 后端返回内容为空', 'error'); return; }
    openPrintWindow(title, html);
  } catch (e) {
    showToast('❌ 打开打印窗口失败：' + (e.message || '网络错误'), 'error');
  }
}

// 模板元数据徽标：source=='user' → 🟡 用户自定义(日期)，否则 🟢 系统默认
async function loadPaperTemplateMeta(paperId) {
  const pBadge = document.getElementById('ptm-badge-' + paperId);
  const sBadge = document.getElementById('stm-badge-' + paperId);
  let meta = null;
  try {
    const res = await fetch(_apiBase() + '/papers/' + encodeURIComponent(paperId) + '/template/meta', { headers: _authHeaders() });
    if (res.ok) { try { meta = await res.json(); } catch (e) {} }
  } catch (e) {}
  const fmt = (t) => {
    if (!t) return '<span style="color:var(--text-sub);">—</span>';
    if (t.source === 'user') {
      let s = '<span style="color:#d48806;">🟡 用户自定义</span>';
      if (t.file_name) s += ' <span style="color:var(--text-sub);">' + escHtml(t.file_name) + '</span>';
      if (t.updated_at) s += '<span style="color:var(--text-sub);">（' + escHtml(String(t.updated_at).slice(0, 10)) + '）</span>';
      return s;
    }
    return '<span style="color:var(--success);">🟢 系统默认</span>';
  };
  if (pBadge) pBadge.innerHTML = meta && meta.paper_template ? fmt(meta.paper_template) : '<span style="color:var(--text-sub);">尚未生成</span>';
  if (sBadge) sBadge.innerHTML = meta && meta.sheet_template ? fmt(meta.sheet_template) : '<span style="color:var(--text-sub);">尚未生成</span>';
}

// 隐藏 input 选择 .docx → 上传覆盖；成功后刷新徽标
function _pickAndUploadTemplate(paperId, kind) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.docx';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = () => {
    const file = input.files && input.files[0];
    input.remove();
    if (!file) return;
    const label = kind === 'paper' ? '试卷模板' : '答题卡模板';
    uploadTemplate(_apiBase() + '/papers/' + encodeURIComponent(paperId) + '/template/' + kind, file)
      .then(d => { if (d) { showToast('✅ ' + label + '已上传覆盖'); loadPaperTemplateMeta(paperId); } });
  };
  input.click();
}

async function resetPaperTemplate(paperId, kind) {
  const label = kind === 'paper' ? '试卷模板' : '答题卡模板';
  if (!confirm('确定将' + label + '恢复为系统默认版吗？将删除当前用户自定义模板。')) return;
  try {
    const res = await fetch(_apiBase() + '/papers/' + encodeURIComponent(paperId) + '/template/' + kind, { method: 'DELETE', headers: _authHeaders() });
    if (!res.ok) {
      let msg = '恢复失败（HTTP ' + res.status + '）';
      try { const d = await res.json(); msg = (d && (d.detail || d.message)) || msg; } catch (e) {}
      showToast('❌ ' + msg, 'error');

}

    if (f.category && t.category !== f.category) return false;
    if (f.status && t.status !== f.status) return false;
    if (f.keyword) {
      const hay = (t.name || '') + ' ' + (t.code || '');
      if (hay.toLowerCase().indexOf(f.keyword.toLowerCase()) < 0) return false;
    }
    return true;
  });
  STATE.paging.taskList = { page: 1, pageSize: (STATE.paging.taskList && STATE.paging.taskList.pageSize) || 10 };
}

// —— 分析数据真实计算（基于答题卡/评分，而非硬编码）——
function _computeTaskStats(task) {
  const sheets = (DATA.answerSheets || []).filter(s => s.taskId === task.id);
  if (!sheets.length) return null;
  const scores = sheets.map(s => Number(s.finalScore) || 0).sort((a, b) => a - b);
  const n = scores.length;
  const sum = scores.reduce((a, b) => a + b, 0);
  const avg = sum / n;
  const median = n % 2 ? scores[(n - 1) / 2] : (scores[n / 2 - 1] + scores[n / 2]) / 2;
  const std = Math.sqrt(scores.reduce((a, b) => a + (b - avg) * (b - avg), 0) / n);
  const pass = scores.filter(s => s >= 60).length;
  const excellent = scores.filter(s => s >= 85).length;
  return {
    avgScore: Math.round(avg * 10) / 10, maxScore: scores[n - 1], minScore: scores[0],
    medianScore: Math.round(median * 10) / 10, stdDev: Math.round(std * 10) / 10,
    passRate: Math.round(pass / n * 100), excellentRate: Math.round(excellent / n * 100),
    uploadedCount: sheets.length, scoredCount: sheets.length
  };
}
function _computeStudentStats(student) {
  const sheets = (DATA.answerSheets || []).filter(s => s.studentId === student.id);
  if (!sheets.length) return null;
  const scores = sheets.map(s => Number(s.finalScore) || 0).sort((a, b) => a - b);
  const n = scores.length;
  const sum = scores.reduce((a, b) => a + b, 0);
  return {
    examCount: n, avgScore: Math.round(sum / n * 10) / 10,
    maxScore: scores[n - 1], minScore: scores[0], lastScore: scores[n - 1]
  };
}
function _computeTeacherStats(teacher) {
  const name = teacher.name;
  const paperCount = (DATA.papers || []).filter(p => p.creator === name || p.creatorName === name).length;
  const taskCount = (DATA.tasks || []).filter(t => t.creator === name).length;
  return { paperCount, taskCount };
}

// 提取题目标准答案的纯文本（去 HTML/LaTeX）
function _normalizeAnswer(ans) {
  return String(ans == null ? '' : ans).replace(/<[^>]+>/g, '').replace(/\s+/g, '').trim();
}

// 确定性伪随机（基于字符串 hash，0-1）
function _seedRandom(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h = (h ^ str.charCodeAt(i)) * 16777619; }
  return ((h >>> 0) % 10000) / 10000;
}

// 模拟 AI 识别出某学生某题的答案（客观题约 80% 正确，主观题给部分分）
function _mockRecognizeAnswer(q, studentId) {
  const r = _seedRandom(studentId + '|' + q.id);
  const t = q.type;
  const correct = _normalizeAnswer(q.answer);
  if (t === 'single_choice') {
    const opts = (q.options || []).map(o => String(safeStr(o)).charAt(0));
    if (!opts.length) return '';
    if (r < 0.8) return correct;
    const wrong = opts.filter(l => l !== correct);
    return wrong.length ? wrong[Math.floor(r * 10) % wrong.length] : correct;
  }
  if (t === 'multi_choice') {
    if (r < 0.7) return correct;
    return correct ? correct.slice(0, Math.max(1, correct.length - 1)) : '';
  }
  if (t === 'true_false') {
    if (r < 0.85) return correct;
    return (correct === '√' || correct === '正确' || correct === 'T' || correct === 'true') ? '×' : '√';
  }
  if (t === 'fill_blank') {
    if (r < 0.7) return correct;
    return correct + '?';
  }
  return '';  // essay 主观题：手写文字，识别留空
}

// 评分：对比标准答案，客观题对/错，主观题按识别内容给部分分
function _gradeQuestion(q, studentAnswer) {
  const score = Number(q.score) || 0;
  const correct = _normalizeAnswer(q.answer);
  const stu = _normalizeAnswer(studentAnswer);
  const t = q.type;
  if (t === 'single_choice' || t === 'multi_choice' || t === 'true_false') {
    return (stu && stu === correct) ? score : 0;
  }
  if (t === 'fill_blank') {
    return (stu && stu === correct) ? score : 0;
  }
  const r = _seedRandom((studentAnswer || '') + '|' + q.id);
  return Math.round(score * (0.6 + r * 0.4) * 10) / 10;
}

function showPhotoPreview(input) {
  const files = input.files;
  window._uploadedImageCount = files.length;  // 记录上传图片数（每张对应一名学生）
  window._uploadFiles = [];  // 保存每张图的 dataURL，供 AI 识别传给后端
  const area = document.getElementById('photoPreviewArea');
  const actionArea = document.getElementById('uploadActionArea');
  let html = `<div style="font-weight:600;margin-bottom:8px;">已选照片（${files.length} 张，每张对应一名学生）：</div><div class="photo-preview">`;
  let loaded = 0;
  for (let i = 0; i < files.length; i++) {
    const reader = new FileReader();
    reader.onload = function(e) {
      window._uploadFiles.push(e.target.result);
      html += `<div class="photo-thumb"><img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;"><button class="remove" onclick="this.parentElement.remove()">×</button></div>`;
      loaded++;
      if (loaded === files.length) {
        html += '</div>';
        area.innerHTML = html;
        actionArea.style.display = 'block';
      }
    };
    reader.readAsDataURL(files[i]);
  }
  if (files.length === 0) {
    area.innerHTML = '<div class="photo-preview"><div class="photo-thumb"><span style="color:var(--text-sub);">📷 照片1</span></div><div class="photo-thumb"><span style="color:var(--text-sub);">📷 照片2</span></div></div>';
    actionArea.style.display = 'block';
  }
}

  const images = window._uploadFiles || [];
  if (!images.length) { showToast('请先选择答题卡照片', 'error'); return; }
  const cfg = _loadAiModelConfig() || {};
  // api_key 优先使用服务端配置（AI_ZHIPU_API_KEY），前端配置的 key 仍兼容传入

  const results = [];
  for (let i = 0; i < images.length; i++) {
    const img = images[i];
    content.innerHTML = `<div style="margin-bottom:8px;font-size:14px;">🤖 正在识别第 ${i + 1}/${images.length} 张答题卡…</div>
      <div class="progress-bar"><div class="fill blue" style="width:${Math.round((i + 1) / images.length * 100)}%;transition:width 0.3s;"></div></div>`;
    let rec = null;
    try {
      rec = await apiPost('/ai/recognize-answer-sheet', {
        task_id: task.id,
        image_base64: img,
        provider: cfg.provider || 'zhipu',
        api_key: cfg.apiKey,
        model: cfg.modelType || 'glm-4v',
      });
    } catch (e) { rec = null; }
    if (!rec || !(rec.answers && rec.answers.length)) {
      results.push({ student: null, error: rec ? '识别结果为空' : '识别失败（网络/模型错误）', aiTotal: 0, n: 0 });
      continue;
    }
    // 仅按识别学号精确匹配学生；不匹配则跳过并提示人工指认（禁止按上传顺序兜底，防止张冠李戴）
    const student = students.find(s => s.code === rec.student_code);
    if (!student) {
      results.push({ student: null, error: '识别学号「' + (rec.student_code || '空') + '」未匹配到本任务学生，已跳过，请人工核对答题卡后单独上传', n: (rec.answers || []).length });
      continue;
    }
    // 识别结果提交后端持久化：answer-sheets 入库 + 服务端客观题判分
    const saved = await apiPost('/exam-tasks/' + encodeURIComponent(task.id) + '/answer-sheets', {
      student_id: student.id,
      image_urls: [img],
      upload_type: 'file',
      upload_device: isMobile() ? 'camera' : 'pc',
      answers: (rec.answers || []).map(a => ({ question_number: Number(a.question_number) || 0, answer: String(a.answer || '') })),
    });
    if (!saved || !saved.id) {
      results.push({ student, error: '识别成功但入库失败（网络/服务端错误），请重试', n: (rec.answers || []).length });
      continue;
    }
    const sheet = {
      id: saved.id,
      taskId: saved.task_id != null ? saved.task_id : task.id,
      studentId: saved.student_id != null ? saved.student_id : student.id,
      studentName: student.name, studentCode: student.code, className: student.className,
      images: [img],
      uploadType: saved.upload_type || 'file', uploadDevice: saved.upload_device || 'pc',
      aiStatus: saved.ai_status || 'completed',
      confirmed: false,
    };
    const ex = DATA.answerSheets.findIndex(as => as.taskId === task.id && as.studentId === student.id);
    if (ex >= 0) DATA.answerSheets[ex] = Object.assign(DATA.answerSheets[ex], sheet); else DATA.answerSheets.push(sheet);
    results.push({ student, n: (rec.answers || []).length, recCode: rec.student_code });
  }

  task.uploadedCount = (DATA.answerSheets || []).filter(as => as.taskId === task.id).length;
  if (['draft', 'pending'].includes(task.status)) task.status = 'in_exam';

  const rows = results.map((r, i) => {
    if (r.error) return `<div style="padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px;color:var(--error);">❌ 第 ${i + 1} 张：${r.error}</div>`;
    const nm = r.student ? `<b>${r.student.code} ${r.student.name}</b>（${r.student.className}）` : `<b>${r.recCode || '未匹配'}</b>`;
    return `<div style="padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px;">✅ ${nm}：识别 ${r.n} 题，答案已入库并完成客观题判分</div>`;
  }).join('');
  content.innerHTML = `
    <div style="margin-bottom:8px;font-size:14px;">🤖 AI 识别完成（真实视觉模型识别）</div>
    ${rows}
    <div style="margin-top:10px;font-size:13px;color:var(--text-sub);">识别答案已提交服务端入库（重复上传自动替换旧卡），客观题已按标准答案自动判分，主观题请到「学生考卷详情」人工评分。</div>
  `;
  showToast(`已识别 ${results.filter(r => !r.error).length} 名学生`);
  setTimeout(() => navigate('exam-task.detail', { id: task.id }), 2500);
}

// AI 重新判分：调用服务端确定性判分（客观题比对标准答案，保留教师评分）
async function aiScoreTask(taskId) {
  const task = DATA.tasks.find(t => t.id === taskId) || DATA.tasks[0];
  const sheets = (DATA.answerSheets || []).filter(as => as.taskId === task.id && typeof as.id === 'number');
  if (!sheets.length) { showToast('该任务暂无已入库的答题卡，请先上传（识别结果入库后才能判分）', 'warning'); return; }
  let ok = 0, fail = 0;
  for (const sheet of sheets) {
    const r = await apiPost('/exam-tasks/answer-sheets/' + sheet.id + '/score', {});
    if (r && r.code === 0) ok++; else fail++;
  }
  showToast(`重新判分完成：成功 ${ok} 张${fail ? '，失败 ' + fail + ' 张' : ''}`);
  navigate('exam-task.detail', { id: task.id });
}

// ---- Per-student scoring actions (P1-D) ----
function _currentStudentAnswerSheet() {
  const rp = STATE.routeParams || {};
  const task = DATA.tasks.find(t => t.id === rp.taskId) || DATA.tasks[0];
  const student = DATA.students.find(s => s.id === rp.studentId) || DATA.students[0];
  return { task, student, answerSheet: DATA.answerSheets.find(as => as.taskId === task.id && as.studentId === student.id) };
}
function confirmQuestionScore(idx) {
  const { answerSheet } = _currentStudentAnswerSheet();
  if (!answerSheet || !answerSheet.questionScores || !answerSheet.questionScores[idx]) { showToast('题目不存在','error'); return; }
  const qs = answerSheet.questionScores[idx];
  const input = document.getElementById('teacherScoreInput-'+idx);
  const val = input ? parseFloat(input.value) : qs.teacherScore;
  if (!isNaN(val)) qs.teacherScore = Math.max(0, Math.min(qs.maxScore, val));
  qs.status = 'teacher_confirmed';
  showToast('评分已保存');
  navigate('exam-task.student-score', STATE.routeParams);
}
function modifyQuestionScore(idx) {
  const { answerSheet } = _currentStudentAnswerSheet();
  if (!answerSheet || !answerSheet.questionScores || !answerSheet.questionScores[idx]) { showToast('题目不存在','error'); return; }
  const qs = answerSheet.questionScores[idx];
  const input = document.getElementById('teacherScoreInput-'+idx);
  const val = input ? parseFloat(input.value) : qs.teacherScore;
  if (!isNaN(val)) qs.teacherScore = Math.max(0, Math.min(qs.maxScore, val));
  qs.status = 'teacher_modified';
  showToast('已修改');
  navigate('exam-task.student-score', STATE.routeParams);
}
function confirmAllScores() {
  const { answerSheet } = _currentStudentAnswerSheet();
  if (!answerSheet || !answerSheet.questionScores) { showToast('无评分数据','error'); return; }
  let n = 0;
  answerSheet.questionScores.forEach(qs => { qs.status = 'teacher_confirmed'; n++; });
  showToast('已确认'+n+'题');
  navigate('exam-task.student-score', STATE.routeParams);
}
function aiRescoreStudent() {
  const { answerSheet } = _currentStudentAnswerSheet();
  if (!answerSheet || !answerSheet.questionScores) { showToast('无评分数据','error'); return; }
  answerSheet.questionScores.forEach(qs => {
    qs.aiScore = Math.round(Math.random() * qs.maxScore * 10) / 10;
    qs.aiConfidence = Math.round(Math.random() * 40 + 60) / 100;
  });
  showToast('AI重评分完成');
  navigate('exam-task.student-score', STATE.routeParams);
}

function _readStudentFilters() {
  return {
    classId: (document.getElementById('studentFilterClass') || {}).value || '',
    grade: (document.getElementById('studentFilterGrade') || {}).value || '',
    keyword: (document.getElementById('studentFilterKeyword') || {}).value || '',
  };
}
function _applyStudentFilters(f) {
  STATE.filteredStudents = DATA.students.filter(s => {
    if (f.classId && s.classId !== f.classId) return false;
    if (f.grade) {
      const cls = DATA.classes.find(c => c.id === s.classId);
      const gradeName = cls ? (DATA.grades.find(g => g.id === cls.gradeId || g.name === cls.grade) || {}).name : '';
      const sGrade = gradeName || (DATA.classes.find(c => c.id === s.classId) || {}).gradeName;
      // Fallback: match against className which often contains grade
      const hay = (s.className || '') + ' ' + (s.gradeName || '');
      if (!hay.includes(f.grade)) return false;
    }
    if (f.keyword) {
      const hay = (s.name || '') + ' ' + (s.code || '');
      if (hay.toLowerCase().indexOf(f.keyword.toLowerCase()) < 0) return false;
    }
    return true;
  });
  STATE.paging.studentList = { page: 1, pageSize: (STATE.paging.studentList && STATE.paging.studentList.pageSize) || 10 };
}
function filterStudents() {
  _applyStudentFilters(_readStudentFilters());
  const el = document.getElementById('studentListBody');
  if (el) el.innerHTML = _renderStudentListBody();
  showToast('已筛选 ' + (STATE.filteredStudents ? STATE.filteredStudents.length : 0) + ' 名学生');
}
function resetStudentFilter() {
  ['studentFilterClass','studentFilterGrade','studentFilterKeyword'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  STATE.filteredStudents = null;
  STATE.paging.studentList = { page: 1, pageSize: (STATE.paging.studentList && STATE.paging.studentList.pageSize) || 10 };
  const el = document.getElementById('studentListBody');
  if (el) el.innerHTML = _renderStudentListBody();
  showToast('筛选已重置');
}

function studentListPageChange(newPage, newPageSize) {
  STATE.paging.studentList = { page: parseInt(newPage, 10) || 1, pageSize: parseInt(newPageSize, 10) || 10 };
  const el = document.getElementById('studentListBody');
  if (el) el.innerHTML = _renderStudentListBody();
}

function saveStudentCreate(autoCode) {
  const name = (document.getElementById('stuName') || {}).value || '';
  if (!name.trim()) { showToast('请填写姓名', 'error'); return; }
  const gender = (document.querySelector('input[name="gender"]:checked') || {}).value || 'male';
  const classId = (document.getElementById('stuClass') || {}).value || DATA.classes[0].id;
  const cls = DATA.classes.find(c => c.id === classId) || DATA.classes[0];
  const newId = 's' + Date.now();
  const student = {
    id: newId, code: autoCode || ('S' + String(DATA.students.length + 1).padStart(3, '0')),
    name: name.trim(), gender: gender, classId: classId, className: cls.code + ' ' + cls.name,
    birthDate: (document.getElementById('stuBirthDate') || {}).value || '',
    enrollmentDate: (document.getElementById('stuEnrollmentDate') || {}).value || '',
    parentName: (document.getElementById('stuParentName') || {}).value || '',
    parentPhone: (document.getElementById('stuParentPhone') || {}).value || '',
    initialEvaluation: (document.getElementById('stuInitialEvaluation') || {}).value || '',
    examCount: 0, avgScore: 0, maxScore: 0, minScore: 0, participationRate: 0,
    classRank: 0, lastScore: 0, lastExamDate: '', improvement: 'stable', lastRank: 0,
    remark: (document.getElementById('stuRemark') || {}).value || '', status: 'active'
  };
  DATA.students.push(student);
  saveLocalStudents();   // 持久化学生数据，防止刷新丢失
  // 班级学生数 +1
  cls.studentCount = (cls.studentCount || 0) + 1;
  STATE.filteredStudents = null;
  showToast('学生创建成功！编号 ' + student.code);
  navigate('student');
}

/* ================================================================
   考后教师评价（recentEvaluations）
   ================================================================ */
function renderEvaluations(s) {
  const evals = (s.recentEvaluations || []).slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  if (!evals.length) {
    return '<div style="padding:24px;text-align:center;color:var(--text-sub);">暂无考后评价，去「考试任务 → 学生考卷详情」录入，或点右上角补录</div>';
  }
  return '<div class="timeline">' + evals.map(ev => `
    <div class="timeline-item">
      <div class="timeline-date">${ev.taskName || ev.taskCode || '考试'} · ${ev.date || ''} · 得分：${ev.score}/${ev.fullScore || 100}</div>
      <div class="timeline-content">${ev.evaluation || ''}</div>
      <div style="font-size:12px;color:var(--text-sub);margin-top:6px;">
        —— ${ev.teacher || ''}${ev.createdAt ? ' · ' + ev.createdAt : ''}
        <button class="btn btn-sm btn-text" onclick="editEvaluation('${s.id}','${ev.id}')">编辑</button>
        <button class="btn btn-sm btn-text" style="color:var(--error);" onclick="deleteEvaluation('${s.id}','${ev.id}')">删除</button>
      </div>
    </div>`).join('') + '</div>';
}

function _evalTaskOptions(selectedId) {
  return DATA.tasks.map(t => `<option value="${t.id}" ${t.id === selectedId ? 'selected' : ''}>${t.code} ${t.name}</option>`).join('');
}

function addEvaluationModal(sid) {

      <div class="form-row"><label>得分 / 满分</label><div class="form-input" style="display:flex;gap:8px;">

        <input type="number" id="evalFullScore" class="form-input" placeholder="满分" value="100" min="0">
      </div></div>
      <div class="form-row"><label>评价内容</label><div class="form-input"><textarea id="evalContent" class="form-input" rows="4" placeholder="本次考试的整体评语"></textarea></div></div>

function confirmAddEvaluation(sid) {
  const s = DATA.students.find(x => x.id === sid);
  if (!s) return;
  const task = DATA.tasks.find(t => t.id === (document.getElementById('evalTask') || {}).value) || {};
  const evaluation = ((document.getElementById('evalContent') || {}).value || '').trim();
  if (!evaluation) { showToast('请填写评价内容', 'error'); return; }
  const rec = {
    id: 'ev' + Date.now(),
    taskId: task.id || '', taskCode: task.code || '', taskName: task.name || '',
    date: (document.getElementById('evalDate') || {}).value || task.createdAt || '',
    score: parseFloat((document.getElementById('evalScore') || {}).value) || 0,
    fullScore: parseFloat((document.getElementById('evalFullScore') || {}).value) || 100,
    evaluation: evaluation, teacher: STATE.userName || '教师',
    createdAt: new Date().toLocaleString('zh-CN'),
  };
  if (!s.recentEvaluations) s.recentEvaluations = [];
  s.recentEvaluations.push(rec);
  saveLocalStudents();
  closeModal();
  showToast('评价已添加');
  navigate('student.detail', { id: sid });
}

// 评分页保存考后评价（自动带任务信息 + 最终成绩，同任务去重更新）
function savePostExamEvaluation() {
  const rp = STATE.routeParams || {};
  const task = DATA.tasks.find(t => t.id === rp.taskId) || DATA.tasks[0];
  const student = DATA.students.find(s => s.id === rp.studentId) || DATA.students[0];
  const answerSheet = DATA.answerSheets.find(as => as.taskId === task.id && as.studentId === student.id);
  const evaluation = ((document.getElementById('postExamEval') || {}).value || '').trim();
  if (!evaluation) { showToast('请填写考后评价', 'error'); return; }
  let finalScore = 0;
  if (answerSheet && answerSheet.questionScores) {
    finalScore = answerSheet.questionScores.reduce((sum, qs) => sum + (qs.teacherScore != null ? qs.teacherScore : (qs.aiScore || 0)), 0);
  }
  if (!student.recentEvaluations) student.recentEvaluations = [];
  const existing = student.recentEvaluations.find(e => e.taskId === task.id);
  const rec = {
    id: existing ? existing.id : ('ev' + Date.now()),
    taskId: task.id, taskCode: task.code || '', taskName: task.name || '',
    date: task.createdAt || new Date().toISOString().slice(0, 10),
    score: finalScore, fullScore: 100, evaluation: evaluation,
    teacher: STATE.userName || '教师', createdAt: new Date().toLocaleString('zh-CN'),
  };
  if (existing) Object.assign(existing, rec); else student.recentEvaluations.push(rec);
  saveLocalStudents();
  showToast('考后评价已保存');
}

async function saveStudentEdit(id) {
  const s = DATA.students.find(x => String(x.id) === String(id));
  if (!s) return;
  const name = ((document.getElementById('editStudentName') || {}).value || '').trim();
  if (!name) { showToast('姓名不能为空', 'error'); return; }
  const genderVal = (document.getElementById('editStudentGender') || {}).value;
  const classId = (document.getElementById('editStudentClass') || {}).value;
  const cls = DATA.classes.find(c => String(c.id) === String(classId)) || {};
  const gender = genderVal === '女' ? 'female' : 'male';
  const birthDate = (document.getElementById('editStudentBirth') || {}).value || null;
  const enrollmentDate = (document.getElementById('editStudentEnroll') || {}).value || null;
  const parentName = (document.getElementById('editStudentParentName') || {}).value;
  const parentPhone = (document.getElementById('editStudentParentPhone') || {}).value;
  const initialEvaluation = (document.getElementById('editStudentEval') || {}).value;
  const remark = (document.getElementById('editStudentRemark') || {}).value;
  const body = {
    name,
    gender,
    class_id: classId ? Number(classId) : s.classId != null ? Number(s.classId) : null,
    birth_date: birthDate || null,
    enrollment_date: enrollmentDate || null,
    parent_name: parentName || null,
    parent_phone: parentPhone || null,
    initial_evaluation: initialEvaluation || null,
    remark: remark || null,
  };
  const resp = await apiPut('/students/' + String(s.id), body);
  if (!resp) { showToast('保存失败：后端未连接或接口异常', 'error'); return; }
  // 成功后同步本地
  s.name = resp.name || name;
  s.gender = resp.gender || gender;
  s.classId = resp.classId != null ? resp.classId : s.classId;
  s.className = resp.className || (cls.code ? (cls.code + ' ' + cls.name) : s.className);
  s.birthDate = resp.birthDate || s.birthDate;
  s.enrollmentDate = resp.enrollmentDate || s.enrollmentDate;
  s.parentName = resp.parentName || s.parentName;
  s.parentPhone = resp.parentPhone || s.parentPhone;
  s.initialEvaluation = resp.initialEvaluation || s.initialEvaluation;
  s.remark = resp.remark || s.remark;
  closeModal();
  navigate('student.detail', { id: s.id });
  showToast('已保存');
}
async function studentArchive(id) {
  const s = DATA.students.find(x => String(x.id) === String(id)) || DATA.students[0];
  if (!s) return;
  const resp = await apiPut('/students/' + String(s.id), { status: 'archived' });
  if (!resp) { showToast('归档失败：后端未连接或接口异常', 'error'); return; }
  s.status = 'archived';
  showToast('已归档');
  navigate('student.detail', { id: s.id });
}

function _readClassFilters() {
  return {
    stage: (document.getElementById('classFilterStage') || {}).value || '',
    keyword: (document.getElementById('classFilterKeyword') || {}).value || '',
  };
}
function _applyClassFilters(f) {
  STATE.filteredClasses = DATA.classes.filter(c => {
    if (f.stage && c.stage !== f.stage) return false;
    if (f.keyword) {
      const hay = (c.name || '') + ' ' + (c.code || '');
      if (hay.toLowerCase().indexOf(f.keyword.toLowerCase()) < 0) return false;
    }
    return true;
  });
  STATE.paging.classList = { page: 1, pageSize: (STATE.paging.classList && STATE.paging.classList.pageSize) || 10 };
}
function filterClasses() {
  _applyClassFilters(_readClassFilters());
  const el = document.getElementById('classListBody');
  if (el) el.innerHTML = _renderClassListBody();
  showToast('已筛选 ' + (STATE.filteredClasses ? STATE.filteredClasses.length : 0) + ' 个班级');
}
function resetClassFilter() {
  ['classFilterStage','classFilterKeyword'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  STATE.filteredClasses = null;
  STATE.paging.classList = { page: 1, pageSize: (STATE.paging.classList && STATE.paging.classList.pageSize) || 10 };
  const el = document.getElementById('classListBody');
  if (el) el.innerHTML = _renderClassListBody();
  showToast('筛选已重置');
}

function classListPageChange(newPage, newPageSize) {
  STATE.paging.classList = { page: parseInt(newPage, 10) || 1, pageSize: parseInt(newPageSize, 10) || 10 };
  const el = document.getElementById('classListBody');
  if (el) el.innerHTML = _renderClassListBody();
}

function _nextClassCode(stage) {
  const prefix = { primary:'A', middle:'B', high:'C' }[stage] || 'A';
  const num = DATA.classes.filter(c => c.code && c.code.startsWith(prefix)).length + 1;
  return prefix + String(num).padStart(2, '0');
}
function updateClassCode(el) {
  const code = _nextClassCode(el.value);
  const disp = document.getElementById('clsCodeDisplay');
  if (disp) disp.textContent = code;

async function saveClassCreate(defaultCode) {
  const name = (document.getElementById('clsName') || {}).value || '';
  if (!name.trim()) { showToast('请填写班级名称', 'error'); return; }
  const stage = (document.querySelector('input[name="stage"]:checked') || {}).value || 'primary';
  const remark = (document.getElementById('clsRemark') || {}).value || '';
  const resp = await apiPost('/classes', { name: name.trim(), stage, remark: remark || null });
  if (!resp) { showToast('创建失败：后端未连接或接口异常', 'error'); return; }
  const cls = {
    id: resp.id != null ? String(resp.id) : ('c' + Date.now()),
    code: resp.classCode || resp.code || defaultCode,
    name: resp.name || name.trim(),
    stage: resp.stage || stage,
    studentCount: resp.studentCount != null ? Number(resp.studentCount) : 0,
    examCount: 0,
    remark: resp.remark || '',
    status: resp.status || 'active',
    headTeacher: '',
    teachers: []
  };
  DATA.classes.push(cls);
  STATE.filteredClasses = null;
  showToast('班级创建成功！编号 ' + cls.code);
  navigate('class');
}

function classAddTeacher(classId) {
  const c = DATA.classes.find(x => x.id === classId);
  if (!c) return;
  const existing = (c.teachers||[]).map(t => t.name);
  const candidates = DATA.teachers.filter(t => !existing.includes(t.name));

  openModal('关联教师', `
    <div class="form-row"><label>教师</label><select id="ctTeacher" class="form-input">${candidates.map(t=>`<option value="${t.name}">${t.name}</option>`).join('')}</select></div>
    <div class="form-row"><label>关系</label><select id="ctRole" class="form-input"><option value="任课教师">任课教师</option><option value="班主任">班主任</option></select></div>
    <div class="form-row"><label>学科</label><select id="ctSubject" class="form-input">${DATA.subjects.map(s=>`<option>${s.name}</option>`).join('')}</select></div>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="classAddTeacherConfirm('${classId}')">保存</button>`);
}
function classAddTeacherConfirm(classId) {
  const c = DATA.classes.find(x => x.id === classId);
  if (!c) return;
  const name = (document.getElementById('ctTeacher')||{}).value || '';
  const role = (document.getElementById('ctRole')||{}).value || '任课教师';
  const subject = (document.getElementById('ctSubject')||{}).value || '';
  if (!name) return;
  if (!(c.teachers||[]).some(t => t.name === name)) c.teachers.push({ name, role, subject });
  if (role === '班主任') c.headTeacher = name;
  closeModal();
  _classRefresh(classId);
  showToast('已关联教师');
}
function classEditTeacher(classId, idx) {
  const c = DATA.classes.find(x => x.id === classId);
  const t = c && c.teachers && c.teachers[idx];
  if (!t) return;
  openModal('修改教师', `

    <div class="form-row"><label>关系</label><select id="ctRole" class="form-input"><option value="任课教师" ${t.role==='任课教师'?'selected':''}>任课教师</option><option value="班主任" ${t.role==='班主任'?'selected':''}>班主任</option></select></div>

  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="classEditTeacherConfirm('${classId}', ${idx})">保存</button>`);
}
function classEditTeacherConfirm(classId, idx) {
  const c = DATA.classes.find(x => x.id === classId);
  const t = c && c.teachers && c.teachers[idx];
  if (!t) return;
  t.name = (document.getElementById('ctTeacher')||{}).value || t.name;
  t.role = (document.getElementById('ctRole')||{}).value;
  t.subject = (document.getElementById('ctSubject')||{}).value;
  if (t.role === '班主任') c.headTeacher = t.name;
  closeModal();
  _classRefresh(classId);
  showToast('已修改');
}
function classRemoveTeacher(classId, idx) {
  const c = DATA.classes.find(x => x.id === classId);
  const t = c && c.teachers && c.teachers[idx];
  if (!c || !t) return;
  c.teachers.splice(idx, 1);
  if (c.headTeacher === t.name) c.headTeacher = ((c.teachers||[]).find(x=>x.role==='班主任')||{}).name || '';

  _classRefresh(classId);
  showToast('已取消关联');
}

function _readTeacherFilters() {
  return {
    subject: (document.getElementById('teacherFilterSubject') || {}).value || '',
    keyword: (document.getElementById('teacherFilterKeyword') || {}).value || '',
  };
}
function _applyTeacherFilters(f) {
  STATE.filteredTeachers = DATA.teachers.filter(t => {
    if (f.subject && !t.subjects.includes(f.subject)) return false;
    if (f.keyword) {
      const hay = (t.name || '') + ' ' + (t.code || '');
      if (hay.toLowerCase().indexOf(f.keyword.toLowerCase()) < 0) return false;
    }
    return true;
  });
  STATE.paging.teacherList = { page: 1, pageSize: (STATE.paging.teacherList && STATE.paging.teacherList.pageSize) || 10 };
}
function filterTeachers() {
  _applyTeacherFilters(_readTeacherFilters());
  const el = document.getElementById('teacherListBody');
  if (el) el.innerHTML = _renderTeacherListBody();
  showToast('已筛选 ' + (STATE.filteredTeachers ? STATE.filteredTeachers.length : 0) + ' 名教师');
}
function resetTeacherFilter() {
  ['teacherFilterSubject','teacherFilterKeyword'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  STATE.filteredTeachers = null;
  STATE.paging.teacherList = { page: 1, pageSize: (STATE.paging.teacherList && STATE.paging.teacherList.pageSize) || 10 };
  const el = document.getElementById('teacherListBody');
  if (el) el.innerHTML = _renderTeacherListBody();
  showToast('筛选已重置');
}

function teacherListPageChange(newPage, newPageSize) {
  STATE.paging.teacherList = { page: parseInt(newPage, 10) || 1, pageSize: parseInt(newPageSize, 10) || 10 };
  const el = document.getElementById('teacherListBody');
  if (el) el.innerHTML = _renderTeacherListBody();
}

        <label style="flex:1;min-width:140px;font-size:13px;">性别

    </div>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTeacherEdit('${t.id}')">保存</button>`);
}
async function saveTeacherEdit(id) {
  const t = DATA.teachers.find(x => String(x.id) === String(id));
  if (!t) return;
  const name = ((document.getElementById('editTeacherName') || {}).value || '').trim();
  if (!name) { showToast('姓名不能为空', 'error'); return; }
  const genderVal = (document.getElementById('editTeacherGender') || {}).value;
  const subjects = Array.from(document.querySelectorAll('.edit-teacher-subject-cb:checked')).map(cb => cb.value);
  const phone = (document.getElementById('editTeacherPhone') || {}).value;
  const remark = (document.getElementById('editTeacherRemark') || {}).value;
  const body = {
    name,
    gender: genderVal === '女' ? 'female' : 'male',
    phone: phone || null,
    subject_ids: subjects.map(sn => _qNameToId(DATA.subjects, sn)).filter(v => v != null),
    remark: remark || null,
  };
  const resp = await apiPut('/teachers/' + String(t.id), body);
  if (!resp) { showToast('保存失败：后端未连接或接口异常', 'error'); return; }
  t.name = resp.name || name;
  t.gender = resp.gender || body.gender;
  t.phone = resp.phone || phone;
  t.remark = resp.remark || remark;
  t.subjects = subjects;
  t.subjectIds = resp.subjectIds || [];
  closeModal();
  navigate('teacher.detail', { id: t.id });
  showToast('已保存');
}
async function teacherDisable(id) {
  const t = DATA.teachers.find(x => String(x.id) === String(id)) || DATA.teachers[0];
  if (!t) return;
  const next = t.status === 'inactive' ? 'active' : 'inactive';
  const resp = await apiPut('/teachers/' + String(t.id), { status: next });
  if (!resp) { showToast('操作失败：后端未连接或接口异常', 'error'); return; }
  t.status = next;
  showToast(next === 'inactive' ? '已停用' : '已启用');
  navigate('teacher.detail', { id: t.id });
}
// 判断教师是否任教某学科（兼容 subjects 名称数组 / subjectIds 数字数组）
function _teacherHasSubject(t, sb) {
  if (Array.isArray(t.subjects) && t.subjects.includes(sb.name)) return true;
  if (Array.isArray(t.subjectIds) && sb.id != null) {
    try { return t.subjectIds.map(Number).includes(Number(sb.id)); } catch (e) { return false; }
  }
  return false;
}
function teacherLinkClass(id) {
  const t = DATA.teachers.find(x => x.id === id) || DATA.teachers[0];
  if (!t) return;
  const linked = t.classes.map(x => x.classId);
  const candidates = DATA.classes.filter(c => !linked.includes(c.id));
  if (!candidates.length) { showToast('没有可关联的班级','error'); return; }
  openModal('关联班级', `
    <div class="form-row"><label>班级</label><select id="tcClass" class="form-input">${candidates.map(c=>`<option value="${c.id}">${c.code} ${c.name}</option>`).join('')}</select></div>
    <div class="form-row"><label>关系</label><select id="tcRole" class="form-input"><option value="任课教师">任课教师</option><option value="班主任">班主任</option></select></div>
    <div class="form-row"><label>学科</label><select id="tcSubject" class="form-input">${DATA.subjects.map(s=>`<option>${s.name}</option>`).join('')}</select></div>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="teacherLinkClassConfirm('${id}')">保存</button>`);
}
async function teacherLinkClassConfirm(id) {
  const t = DATA.teachers.find(x => String(x.id) === String(id));
  if (!t) return;
  const classId = (document.getElementById('tcClass')||{}).value || '';
  const role = (document.getElementById('tcRole')||{}).value || '任课教师';
  const subject = (document.getElementById('tcSubject')||{}).value || '';
  if (!classId) { showToast('请选择班级','error'); return; }
  if (!t.classes.some(x => String(x.classId) === String(classId))) {
    t.classes.push({ classId, role, subject });
  }
  // 落库：全量提交教师-班级关联
  const items = t.classes.map(x => ({
    class_id: Number(x.classId),
    role: x.role === '班主任' ? 'head_teacher' : 'subject_teacher',
    subject_id: _qNameToId(DATA.subjects, x.subject),
  }));
  const resp = await apiPost('/teachers/' + String(t.id) + '/classes', items);
  if (!resp) { showToast('保存失败：后端未连接或接口异常', 'error'); return; }
  // 同步班级教师表（若不存在）
  const c = DATA.classes.find(x => String(x.id) === String(classId));
  if (c && !c.teachers.some(x => x.name === t.name)) c.teachers.push({ name:t.name, role, subject });
  if (c && role === '班主任') c.headTeacher = t.name;
  closeModal();
  navigate('teacher.detail', { id: t.id });
  showToast('已关联班级');
}
async function teacherUnlinkClass(id, idx) {
  const t = DATA.teachers.find(x => String(x.id) === String(id));
  if (!t || !t.classes[idx]) return;
  const removed = t.classes[idx];
  t.classes.splice(idx, 1);
  // 落库：全量提交教师-班级关联
  const items = t.classes.map(x => ({
    class_id: Number(x.classId),
    role: x.role === '班主任' ? 'head_teacher' : 'subject_teacher',
    subject_id: _qNameToId(DATA.subjects, x.subject),
  }));
  const resp = await apiPost('/teachers/' + String(t.id) + '/classes', items);
  if (!resp) { showToast('保存失败：后端未连接或接口异常', 'error'); return; }
  const c = DATA.classes.find(x => String(x.id) === String(removed.classId));
  if (c) {
    c.teachers = (c.teachers || []).filter(x => x.name !== t.name);
    if (c.headTeacher === t.name) c.headTeacher = (c.teachers.find(x=>x.role==='班主任')||{}).name || '';
  }
  navigate('teacher.detail', { id: t.id });
  showToast('已取消关联');
}

function _knowledgeFilter() {
  if (!STATE.knowledgeFilter) STATE.knowledgeFilter = { subject:'数学', grade:'初一' };
  if (!DATA.knowledgeTree[STATE.knowledgeFilter.subject]) DATA.knowledgeTree[STATE.knowledgeFilter.subject] = {};
  if (!DATA.knowledgeTree[STATE.knowledgeFilter.subject][STATE.knowledgeFilter.grade]) DATA.knowledgeTree[STATE.knowledgeFilter.subject][STATE.knowledgeFilter.grade] = [];
  return STATE.knowledgeFilter;
}
function _knowledgeTreeArr() {
  const f = _knowledgeFilter();
  return DATA.knowledgeTree[f.subject][f.grade];
}
function _knowledgeRefresh() {
  const el = document.getElementById('knowledgeTreeContainer');
  if (el) el.innerHTML = renderKnowledgeTree();
}
function _knowledgeNodeByPath(path) {
  let arr = _knowledgeTreeArr();
  let node = null;
  for (let i = 0; i < path.length; i++) {
    node = arr[path[i]];
    if (!node) return null;
    arr = node.children || [];
  }
  return node;
}
function knowledgeFilterChange() {
  const f = _knowledgeFilter();
  const s = (document.getElementById('knowledgeSubjectSel') || {}).value;
  const g = (document.getElementById('knowledgeGradeSel') || {}).value;
  if (s) f.subject = s;
  if (g) f.grade = g;
  if (!DATA.knowledgeTree[f.subject]) DATA.knowledgeTree[f.subject] = {};
  if (!DATA.knowledgeTree[f.subject][f.grade]) DATA.knowledgeTree[f.subject][f.grade] = [];
  _knowledgeRefresh();
}
function knowledgeAddRoot() {
  _promptTextModal('新建根节点', '节点名称', '', (val) => {
    if (!val.trim()) { showToast('请输入名称','error'); return; }
    _knowledgeTreeArr().push({ name: val.trim(), children: [] });
    _knowledgeRefresh();
    showToast('根节点已创建');
  });
}
function knowledgeAddChild(path) {
  const parent = _knowledgeNodeByPath(path);
  if (!parent) { showToast('节点不存在','error'); return; }
  if (!parent.children) parent.children = [];
  _promptTextModal('新建子节点', '子节点名称', '', (val) => {
    if (!val.trim()) { showToast('请输入名称','error'); return; }
    parent.children.push({ name: val.trim(), children: [] });
    _knowledgeRefresh();
    showToast('子节点已创建');
  });
}
function knowledgeEditNode(path) {
  const node = _knowledgeNodeByPath(path);
  if (!node) { showToast('节点不存在','error'); return; }
  _promptTextModal('编辑节点', '节点名称', node.name, (val) => {
    if (!val.trim()) { showToast('名称不能为空','error'); return; }
    node.name = val.trim();
    _knowledgeRefresh();
    showToast('已保存');
  });
}
function knowledgeDeleteNode(path) {
  const node = _knowledgeNodeByPath(path);
  if (!node || path.length === 0) { showToast('节点不存在','error'); return; }
  openModal('确认删除', `<p>确定删除节点「${node.name}」及其所有子节点吗？</p>`,
    `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="_knowledgeDeleteConfirm(${JSON.stringify(path)})">删除</button>`);
}
function _knowledgeDeleteConfirm(path) {
  closeModal();
  const idx = path[path.length - 1];
  if (path.length === 1) {
    _knowledgeTreeArr().splice(idx, 1);
  } else {
    const parent = _knowledgeNodeByPath(path.slice(0, -1));
    if (parent && parent.children) parent.children.splice(idx, 1);
  }
  _knowledgeRefresh();
  showToast('已删除');
}

function renderKnowledgePage() {
  const f = _knowledgeFilter();
  const subjectOpts = DATA.subjects.map(s => `<option ${s.name===f.subject?'selected':''}>${s.name}</option>`).join('');
  const gradeOpts = DATA.grades.map(g => `<option ${g.name===f.grade?'selected':''}>${g.name}</option>`).join('');
  return `
    ${getMobilePrompt('知识点管理建议在电脑端操作')}
    <div class="page-header">

    </div>

      <div class="filter-item"><label>年级：</label><select id="knowledgeGradeSel" onchange="knowledgeFilterChange()">${gradeOpts}</select></div>
    </div>
    <div class="card">
      <div class="card-title">知识点树形结构</div>
      <div id="knowledgeTreeContainer">${renderKnowledgeTree()}</div>
    </div>
  `;
}

function renderKnowledgeTree() {
  const tree = _knowledgeTreeArr();
  let html = '';
  function renderNode(node, level=0, path=[]) {
    const hasChildren = node.children && node.children.length > 0;
    const isLeaf = !hasChildren && node.kp;
    const icon = isLeaf ? '📄' : '📁';
    html += `<div style="padding-left:${level*20}px;">
      <div class="tree-item">
        <span class="tree-icon">${icon}</span>
        <span class="tree-label">${node.name}</span>
        ${isLeaf ? `<span class="tag tag-blue" style="margin-left:8px;">${node.kp}</span>` : ''}
        <div class="tree-actions">
          ${!isLeaf ? `<button class="btn btn-sm btn-text" onclick="knowledgeAddChild(${JSON.stringify(path)})">+ 子节点</button>` : ''}
          <button class="btn btn-sm btn-text" onclick="knowledgeEditNode(${JSON.stringify(path)})">编辑</button>
          <button class="btn btn-sm btn-text" style="color:var(--error);" onclick="knowledgeDeleteNode(${JSON.stringify(path)})">删除</button>
        </div>
      </div>`;
    if (hasChildren) {
      node.children.forEach((child, i) => renderNode(child, level+1, path.concat(i)));
    }
    html += `</div>`;
  }
  tree.forEach((node, i) => renderNode(node, 0, [i]));
  return html;
}
